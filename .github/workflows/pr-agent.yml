name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENCODE_KEY }}
          OPENAI.API_BASE: "https://opencode.ai/zen/v1"
          config.model: "openai/deepseek-v4-flash-free"
          config.fallback_models: '["openai/deepseek-v4-flash-free"]'
          config.custom_model_max_tokens: "16000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
