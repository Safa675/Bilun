name: Release Hold

# A successful CI run on main records the exact reviewed commit. Production
# activation remains held until the private candidate and rollback gate exist.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-hold
  cancel-in-progress: false

jobs:
  release_hold:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.actor.login == 'Safa675'
      }}
    runs-on: [self-hosted, Linux, X64, bilun-laptop-ci]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify reviewed commit and record production hold
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          {
            echo "### Production release held"
            echo ""
            echo "CI run #${CI_RUN_ID} passed on main at ${CI_HEAD_SHA}."
            echo "Production was not deployed. Wave A requires a privately verified candidate and reviewed activation and rollback evidence."
          } >> "$GITHUB_STEP_SUMMARY"
