name: SUT Monitor

on:
  schedule:
    # 2×/day at 06:00 and 18:00 UTC (09:00/21:00 TRT)
    - cron: "0 6,18 * * *"
  workflow_dispatch: # Manual trigger

concurrency:
  group: sut-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install polars requests pyarrow openpyxl xlrd

      - name: Check for new SUT tebliğ
        id: monitor
        run: python scripts/sut/sut_monitor.py

      - name: Skip — no new tebliğ
        if: steps.monitor.outputs.new_teblig == ''
        run: echo "No new SUT tebliğ detected. Exiting."

      - name: Fetch new SUT package
        if: steps.monitor.outputs.new_teblig != ''
        id: fetch
        run: |
          python scripts/sut/sut_fetch.py \
            "${{ steps.monitor.outputs.new_teblig_url }}" \
            "${{ steps.monitor.outputs.new_teblig_date }}"

      - name: Capture OLD_DATE (pre-ingest)
        if: steps.monitor.outputs.new_teblig != ''
        id: capture
        run: |
          # Keep the last complete-package date for the temporal annex delta.
          if [ -f data/gazette/ingest_state.json ]; then
            OLD_DATE=$(python3 -c "import json,sys; print(json.load(open('data/gazette/ingest_state.json')).get('last_ingested_date') or '')")
          else
            OLD_DATE=""
          fi
          echo "old_date=$OLD_DATE" >> "$GITHUB_OUTPUT"
          echo "Captured OLD_DATE=$OLD_DATE"

      - name: Snapshot old clause corpus (pre-extract)
        if: steps.monitor.outputs.new_teblig != ''
        run: |
          # MUST run BEFORE extract_sut_prose.py — it overwrites
          # data/gazette/sut_clauses.parquet with the re-extracted corpus.
          # The snapshot is the "old" side of the Track E clause_key diff.
          cp data/gazette/sut_clauses.parquet /tmp/sut_clauses_old.parquet
          echo "Snapshot old corpus -> /tmp/sut_clauses_old.parquet"

      - name: Run ingest pipeline
        if: steps.monitor.outputs.new_teblig != ''
        run: |
          python scripts/sut/convert_xlsx_to_parquet.py \
            --input-dir "${{ steps.fetch.outputs.input_dir }}" --defer-state
          python scripts/sut/build_curated_catalogs.py --overwrite
          # Extract the exact pinned DOCX; a semantic rerun preserves corpus bytes.
          python scripts/sut/sut_ingest_state.py \
            --input-dir "${{ steps.fetch.outputs.input_dir }}" \
            --inventory "${{ steps.fetch.outputs.inventory_path }}" --prepare-corpus

      - name: Compute clause_key diff (Track E)
        if: steps.monitor.outputs.new_teblig != ''
        id: clause_diff
        run: |
          # Track E Phase 5: compare old vs re-extracted corpus by clause_key
          # (coord#hash). STABLE clauses keep refs valid; AMENDED/NEW/REMOVED
          # rows become the human triage list in the PR body.
          legacy_args=()
          receipt="data/gazette/deltas/${{ steps.monitor.outputs.new_teblig_date }}_clause_diff_inputs.json"
          if [ -f "$receipt" ]; then
            legacy_args=(--legacy-input-fingerprints "$receipt")
          fi
          python scripts/sut/sut_clause_diff.py \
            /tmp/sut_clauses_old.parquet \
            data/gazette/sut_clauses.parquet \
            --new-date "${{ steps.monitor.outputs.new_teblig_date }}" \
            "${legacy_args[@]}"

      - name: Compute delta
        if: steps.monitor.outputs.new_teblig != '' && steps.capture.outputs.old_date != ''
        id: delta
        run: |
          legacy_args=()
          receipt="data/gazette/deltas/${{ steps.monitor.outputs.new_teblig_date }}_delta_inputs.json"
          if [ -f "$receipt" ]; then
            legacy_args=(--legacy-input-fingerprints "$receipt")
          fi
          python scripts/sut/sut_delta.py \
            "${{ steps.capture.outputs.old_date }}" "${{ steps.monitor.outputs.new_teblig_date }}" \
            "${legacy_args[@]}"

      - name: Complete verified package ingestion
        if: steps.monitor.outputs.new_teblig != ''
        run: |
          # This gate is reached only after conversion, curation, prose and reports succeed.
          python scripts/sut/sut_ingest_state.py \
            --input-dir "${{ steps.fetch.outputs.input_dir }}" \
            --inventory "${{ steps.fetch.outputs.inventory_path }}"

      - name: Create PR
        if: steps.monitor.outputs.new_teblig != ''
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore(sut): ingest ${{ steps.monitor.outputs.new_teblig_date }} amendment"
          body: |
            ${{ steps.clause_diff.outputs.clause_diff_summary }}

            ${{ steps.delta.outputs.delta_summary }}
          branch: chore/sut-auto-update
          labels: sut-update, automated
          commit-message: "chore(sut): auto-ingest ${{ steps.monitor.outputs.new_teblig_date }} SUT amendment"
          # NOTE: This PR must NOT auto-merge. Human review required.
          # Set branch protection on chore/sut-auto-update to enforce.
