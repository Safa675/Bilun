name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ scripts/

      - name: Run Python tests
        run: python -m pytest -n auto -q

      - name: Check generated SUT rule artifacts
        run: python scripts/sut/compile_rules.py --check

      - name: Audit manifest bucket/trace parity
        run: python scripts/sut/audit_manifest_parity.py --drug-only

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
