name: Strict Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/deploy/**'
      - 'docs/operations/**'
      - 'tests/unit/deploy/**'
      - 'tests/integration/deploy/**'
      - 'src/bilun/api/wavea_activation.py'
      - 'src/bilun/api/startup.py'
  push:
    branches: [main]
    paths:
      - 'scripts/deploy/**'
      - 'docs/operations/**'
      - 'tests/unit/deploy/**'
      - 'tests/integration/deploy/**'
      - 'src/bilun/api/wavea_activation.py'
      - 'src/bilun/api/startup.py'

permissions:
  contents: read

concurrency:
  group: strict-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict_release:
    if: >-
      github.repository == 'Safa675/Bilun' && github.triggering_actor == 'Safa675' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.user.login == 'Safa675'))
    runs-on: [self-hosted, Linux, X64, bilun-laptop-ci]
    timeout-minutes: 60
    env:
      PYTEST_XDIST_AUTO_NUM_WORKERS: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check isolated runtime and frozen dependencies
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.13.15"
          test "$(node --version)" = "v22.16.0"
          test "$(sha256sum requirements-ci.lock | cut -d ' ' -f 1)" = "$BILUN_CI_LOCK_SHA256"

      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index --find-links=/opt/wheels --require-hashes -r requirements-ci.lock
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps --no-build-isolation -e .
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Run strict release tests
        run: |
          basetemp="$HOME/.cache/bilun-strict-release-pytest"
          trap 'rm -rf -- "$basetemp"' EXIT
          python -m pytest -q -n auto -m strict_release --durations=20 --basetemp="$basetemp"
