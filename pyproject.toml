[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bilun"
version = "0.1.0"
description = "BILUN — SUT billing optimization and analytics platform"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.100",
    "httpx>=0.24",
    "jsonschema>=4.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn==1.7.2",
    "scipy>=1.10",
    "uvicorn>=0.23.0",
    "xlrd>=2.0.1",   # read legacy .xls SUT annex files (EK-1A, EK-3B, EK-3C-1, EK-2Ç, etc.)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
bilun-build-cache = "src.bilun.cache.builder:main"
bilun-build-clause-embeddings = "scripts.sut.build_clause_embeddings:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "scripts", "scripts.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--ignore=tests/archive"
markers = [
    "unit: fast unit tests with no external services",
    "smoke: integration/smoke tests that may need a running app or cache",
    "live: tests against a live deployed server",
]
