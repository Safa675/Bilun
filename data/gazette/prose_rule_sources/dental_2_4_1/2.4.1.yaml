section_id: 2.4.1
source_note: Exported from dental_2_4_1.json (YAML source migration)
rules:
- rule_id: 2.4.1.(1).precious_metal_no_pay
  sut_section: 2.4.1
  condition:
    procedure_category: dental_restoration
    material_name_any:
    - altın
    - platin
    - paladyum+platin
    - iridyum+platin
    - iropal
    - argenco 23
    - bego gold ewl
    - polliag-m
    material_contains_precious_metal: true
  action:
    billable: false
    denial_tr: diş tedavisinde altın, platin, paladyum+platin, iridyum+platin, iropal, argenco 23, bego gold EWL, polliag-M
      gibi kıymetli maden içeren maddelerin bedelleri ödenmez
    severity: error
  gate_b_sources:
  - C000734
- rule_id: 2.4.1.(2).bone_implant_no_pay_default
  sut_section: 2.4.1
  condition:
    procedure_category: dental_implant
    medical_necessity_board_report: false
  action:
    billable: false
    denial_tr: kemik içi implantların bedelleri ödenmez (sağlık kurulu raporu yok)
    severity: error
  gate_b_sources:
  - C000742
- rule_id: 2.4.1.(2).bone_implant_exception_board_report
  sut_section: 2.4.1
  condition:
    procedure_category: dental_implant
    medical_necessity_board_report: true
    board_includes:
    - surgery
    - prosthodontics
    - periodontology
    board_from: university_dental_faculty
    radiographic_evidence_attached_to_report: true
    implant_count_specified_in_report: true
    max_implants_per_jaw: 4
  action:
    billable: true
    payment_tr: rutin protetik tedavi ile yapılamayacağı implant zorunlu olduğu; üniversite diş hekimliği fakültesi cerrahi/protez/periodontoloji
      anabilim dallarından ≥1 öğretim üyesi katılımlı sağlık kurulu, radyografik tetkikler ve implant adedi belirtilmişse;
      her çene için en fazla 4 implant, her implant için EK-2/Ç kemik içi implant bedeli artı 750 TL; vazife/harp malullerinde
      (3713/5434/2330) her implant için en fazla 2.500 TL üzerinden faturalandırılır
    annex_basis: EK-2/Ç
    billing_method: per_implant
    surcharge_per_implant_try: 750
    malul_vazife_harp_max_per_implant_try: 2500
  gate_b_sources:
  - C000747
  - C000744
  - C000745
  - C000746
  verification_status: ai_generated_pending_review
  content_note: 'Enhanced: added the numeric caps from C000747 (max 4 implants/jaw; +750 TL/implant on top of EK-2/Ç fee; max
    2.500 TL/implant for vazife/harp malulleri per 3713/5434/2330) plus the radiographic-evidence and implant-count requirements.
    Previously only the board-report condition was encoded.'
- rule_id: 2.4.1.(3).prosthesis_4yr_renewal_cap
  sut_section: 2.4.1
  condition:
    procedure_category_any:
    - fixed_prosthesis
    - removable_prosthesis
    years_since_last_prosthesis:
      max: 4
    is_traffic_or_work_injury: false
  action:
    billable: false
    denial_tr: hareketli ve sabit protez yenilenme süresi 4 yıl; bu süreden önce yapılan yenileme bedelleri ödenmez (trafik/iş
      kazası hariç)
    severity: error
  gate_b_sources:
  - C000748
- rule_id: 2.4.1.(4a).orthodontics_over_18_no_pay
  sut_section: 2.4.1
  condition:
    procedure_category: orthodontics
    patient_age:
      min: 18
    treatment_started_before_18: false
  action:
    billable: false
    denial_tr: 18 yaşını doldurmuş kişilerin ortodontik diş tedavi giderleri ödenmez (18 öncesi başlamış ve devam ediyorsa
      hariç)
    severity: error
  gate_b_sources:
  - C000752
  - C000751
