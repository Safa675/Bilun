section_id: 2.4.1
source_note: Exported from dental_2_4_1.json (YAML source migration)
rules:
- rule_id: 2.4.1.(1).precious_metal_no_pay
  sut_section: 2.4.1
  condition:
    procedure_category: dental_restoration
    material_name_any:
    - altın
    - platin
    - paladyum+platin
    - iridyum+platin
    - iropal
    - argenco 23
    - bego gold ewl
    - polliag-m
    material_contains_precious_metal: true
  action:
    billable: false
    denial_tr: diş tedavisinde altın, platin, paladyum+platin, iridyum+platin, iropal, argenco 23, bego gold EWL, polliag-M
      gibi kıymetli maden içeren maddelerin bedelleri ödenmez
    severity: error
  gate_b_sources:
  - C000734
- rule_id: 2.4.1.(2).bone_implant_no_pay_default
  sut_section: 2.4.1
  condition:
    procedure_category: dental_implant
    medical_necessity_board_report: false
  action:
    billable: false
    denial_tr: kemik içi implantların bedelleri ödenmez (sağlık kurulu raporu yok)
    severity: error
  gate_b_sources:
  - C000742
- rule_id: 2.4.1.(2).bone_implant_exception_board_report
  sut_section: 2.4.1
  condition:
    procedure_category: dental_implant
    medical_necessity_board_report: true
    board_includes:
    - surgery
    - prosthodontics
    - periodontology
    board_from: university_dental_faculty
  action:
    billable: true
    payment_tr: rutin protetik tedavi ile yapılamayacağı implant zorunlu olduğu; üniversite diş hekimliği fakültesi cerrahi/protez/periodontoloji
      anabilim dallarından ≥1 öğretim üyesi katılımlı sağlık kurulu ile belgelendirilmişse implant bedeli ödenir
  gate_b_sources:
  - C000747
  - C000744
  - C000745
  - C000746
- rule_id: 2.4.1.(3).prosthesis_4yr_renewal_cap
  sut_section: 2.4.1
  condition:
    procedure_category_any:
    - fixed_prosthesis
    - removable_prosthesis
    years_since_last_prosthesis:
      max: 4
    is_traffic_or_work_injury: false
  action:
    billable: false
    denial_tr: hareketli ve sabit protez yenilenme süresi 4 yıl; bu süreden önce yapılan yenileme bedelleri ödenmez (trafik/iş
      kazası hariç)
    severity: error
  gate_b_sources:
  - C000748
- rule_id: 2.4.1.(4a).orthodontics_over_18_no_pay
  sut_section: 2.4.1
  condition:
    procedure_category: orthodontics
    patient_age:
      min: 18
    treatment_started_before_18: false
  action:
    billable: false
    denial_tr: 18 yaşını doldurmuş kişilerin ortodontik diş tedavi giderleri ödenmez (18 öncesi başlamış ve devam ediyorsa
      hariç)
    severity: error
  gate_b_sources:
  - C000752
  - C000751
