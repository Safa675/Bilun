section_id: 2.4.1.A
source_note: Exported from dental_2_4_1.json (YAML source migration)
rules:
- rule_id: 2.4.1.A.(1).public_facility_ek2c_pricing
  sut_section: 2.4.1.A
  condition:
    procedure_category: dental_treatment
    facility_type: public_contracted
  action:
    billable: true
    payment_tr: resmi sözleşmeli sunucuda diş tedavi bedelleri EK-2/Ç uygulanır; protezde döküm/işçilik ayrı ödenmez (malzeme+işçilik
      dahil)
    annex_basis: EK-2/Ç
  gate_b_sources:
  - C000760
- rule_id: 2.4.1.A.(1).university_dental_faculty_50pct_surcharge
  sut_section: 2.4.1.A
  condition:
    procedure_category: dental_treatment
    facility_type: university_dental_faculty
    procedure_code_not_in:
    - "401051"
    - "401060"
    - "401070"
    - "401080"
    - "401090"
    - "401100"
    - "401110"
    - "401120"
    - "401130"
    - "401135"
    - "401150"
    - "401170"
  action:
    billable: true
    payment_tr: üniversite diş hekimliği fakültelerince EK-2/Ç puanlarına %50 ilave edilerek faturalandırılır; 401051-401170
      arası hariç tutulmuş kodlar bu ilaveden muaftır
    annex_basis: EK-2/Ç
    multiplier: 1.5
  gate_b_sources:
  - C000760
  verification_status: ai_generated_pending_review
  content_note: 'Encodes the university dental-faculty +50% EK-2/Ç surcharge from C000760 (was previously only loose prose in
    2.4.1.A.(1)). Excluded codes (401051/060/070/080/090/100/110/120/130/135/150/170) do NOT get the +50%. Interaction: for
    disabled/special-needs GA/sedo at university faculty the +50% is NOT additionally applied — see 2.4.1.A.(3) (C000763).'
- rule_id: 2.4.1.A.(2).disabled_special_needs_2x_pricing
  sut_section: 2.4.1.A
  condition:
    procedure_category: dental_treatment
    procedure_under_ga_or_sedoanalgesia: true
    patient_category_any:
    - disabled_40_pct_or_more
    - special_needs_child
    facility_type: public_contracted
  action:
    billable: true
    payment_tr: ≥%40 engelli veya özel gereksinimli çocuklara GA/sedoanaljezi altında diş tedavisi EK-2/Ç puan bedellerinin
      2 katı olarak faturalandırılır
    annex_basis: EK-2/Ç
    multiplier: 2.0
  gate_b_sources:
  - C000762
- rule_id: 2.4.1.A.(3).disabled_ga_no_extra_50pct_surcharge
  sut_section: 2.4.1.A
  condition:
    procedure_category: dental_treatment
    procedure_under_ga_or_sedoanalgesia: true
    patient_category_any:
    - disabled_40_pct_or_more
    - special_needs_child
    facility_type: university_dental_faculty
  action:
    billable: true
    payment_tr: üniversite diş fakültesinde engelli/özel gereksinimli çocuk GA/sedo tedavisinde %50 ilave oran ayrıca uygulanmaz
  gate_b_sources:
  - C000763
