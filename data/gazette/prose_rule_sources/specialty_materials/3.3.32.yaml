- rule_id: 3.3.32.(1).dijital_isitme_cihazi_must_bill
  sut_section: 3.3.32
  deontic: MUST_BILL
  gate_b_sources:
  - C003283
  condition:
    material_name_any:
    - işitme cihazı
    - isitme cihazi
  action:
    material_outcome: review_required
    severity: info
    message_tr: Dijital programlanabilir işitme cihazları (kulak arkası / kulak içi / kanal içi) — Kurumca bedeli karşılanır
      (§3.3.32(1)).
- rule_id: 3.3.32.(4).saf_ses_odyometri_icerik_regulatory
  sut_section: 3.3.32
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C003296
  condition:
    material_name_any:
    - işitme cihazı
    - isitme cihazi
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Saf ses odyometrisi 500-1000-2000-4000 Hz hava ve kemik yolu eşikleri ile konuşmayı ayırt etme skorunu içermelidir;
      8 yaş üstünde test yapılamıyorsa gerekçesi belirtilmelidir (§3.3.32(4)).
- rule_id: 3.3.32.a.cocuk_kbb_3_basamak_rapor_regulatory
