  condition:
    material_name_any:
    - işitme cihazı
    - isitme cihazi
  action:
    material_outcome: review_required
    severity: warning
    message_tr: 0-18 yaş çocuklarda işitme cihazı için en az 1 KBB uzmanı yer alan 3. basamak resmi sunucu sağlık kurulu raporu
      düzenlenmesi gerekmektedir (§3.3.32 a).
- rule_id: 3.3.32.b.yetiskin_kbb_rapor_regulatory
