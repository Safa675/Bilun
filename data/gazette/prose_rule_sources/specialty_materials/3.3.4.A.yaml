      üzere Kurumca karşılanır (§3.3.4.A(b)).
- rule_id: 3.3.4.A.(13).bone_cyst_allograft_xenograft_120cc_cap
  sut_section: 3.3.4.A
  deontic: REGULATORY_ACTION
  gate_b_sources:
