    material_outcome: review_required
    severity: info
    message_tr: Fasiya Temporalis alan tanımındaki allogreftler yalnızca Kulak Burun Boğaz uzmanlık dalınca kullanıldığında
      Kurumca karşılanır (§3.3.4.A(15)).
- rule_id: 3.3.4.A.(17).graft_op_note_epikriz_mandatory
  sut_section: 3.3.4.A
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002957
