  gate_b_sources:
  - C002948
  condition:
    allograft_xenograft_per_case_60cc_cap: true
  action:
    material_outcome: review_required
    severity: info
    message_tr: Allogreft/xenogreft kullanılan tüm uygulamalarda vaka başı 60 cc’yi geçmemek üzere Kurumca karşılanır (§3.3.4.A(11)).
- rule_id: 3.3.4.A.a.posterior_spinal_allograft_xenograft_cap
