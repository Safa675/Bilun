- rule_id: 3.3.4.A.b.posterior_spinal_synthetic_graft_cap
  sut_section: 3.3.4.A
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002951
  condition:
    posterior_spinal_synthetic_graft_per_level_cap: true
  action:
    material_outcome: review_required
    severity: info
