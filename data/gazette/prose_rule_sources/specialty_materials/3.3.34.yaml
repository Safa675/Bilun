section_id: 3.3.34
source_note: Exported from specialty_materials_prose.json (YAML source migration)
rules:
- rule_id: 3.3.34.(4).tv5680_combo_billing
  sut_section: 3.3.34
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.34.(4)
  condition:
    tv5680_with_tv1080_tv1090_combo: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: TV5680, TV1080/TV1090 ile birlikte faturalandırılamaz — karşılanmaz (§3.3.34(4)).
- rule_id: 3.3.34.(2).hasta_alt_bezi_nakden_aylik_must_bill
  sut_section: 3.3.34
  deontic: MUST_BILL
  gate_b_sources:
  - C003435
  condition:
    material_name_any:
    - hasta alt bezi
    - külotlu hasta alt bezi
    - cocuk hasta alt bezi
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Hasta alt bezi/külotlu hasta alt bezi — primer inkontinans tanısı belirtilmesi ve günde 4 adedi geçmemek
      kaydıyla 18 yaş üstü için A10049, 3-18 yaş için A10118 kodlu malzeme fiyatı üzerinden 1 aylık tutar nakden ödenir 
      (§3.3.34(2)).
- rule_id: 3.3.34.(3).inkontinans_hidrofilik_sonda_must_bill
  sut_section: 3.3.34
  deontic: MUST_BILL
  gate_b_sources:
  - 3.3.34.(3)
  condition:
    material_name_any:
    - hidrofilik kendinden kayganlaştırıcılı sonda
    - hidrofilik sonda
  action:
    material_outcome: review_required
    severity: info
    message_tr: İdrar/gaita inkontinansı nedeniyle hasta alt bezi ödemesi alan hastalarda; SUT hükümlerine göre 
      düzenlenen sağlık raporu ve reçeteye istinaden hidrofilik kendinden kayganlaştırıcılı sonda bedeli Kurumca 
      karşılanır (§3.3.34(3)).
