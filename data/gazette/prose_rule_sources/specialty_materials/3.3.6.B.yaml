- rule_id: 3.3.6.B.(7).oksijen_konsantrator_tup_must_bill
  sut_section: 3.3.6.B
  deontic: MUST_BILL
  gate_b_sources:
  - 3.3.6.B.(7)
  condition:
    material_name_any:
    - oksijen tüpü
    - oksijen tupu
  action:
    material_outcome: review_required
    severity: info
    message_tr: Oksijen konsantratörü verilen kişilere, raporda belirtilmek koşuluyla oksijen tüpü önerilmesi halinde bedeli
