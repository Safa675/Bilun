- rule_id: 3.3.6.B.(6).tasinabilir_oksijen_efor_must_bill
  sut_section: 3.3.6.B
  deontic: MUST_BILL
  gate_b_sources:
  - 3.3.6.B.(6)
  condition:
    material_name_any:
    - taşınabilir oksijen
    - tasinabilir oksijen
  action:
    material_outcome: review_required
    severity: info
    message_tr: Taşınabilir oksijen komponentli cihaz — istirahatte PaO2 > 55 / SaO2 > %88 iken eforla desatüre olan mobilize/aktif/öğrenci
