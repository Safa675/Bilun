  action:
    material_outcome: no_pay
    severity: error
    message_tr: Yetişkin primer kırıkta kemik uyarıcı malzeme — karşılanmaz (§3.3.4(9)/(7)).
- rule_id: 3.3.4.(6).hip_arthroplasty_graft_no_pay
  sut_section: 3.3.4
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.4.A.(6)
  condition:
