rules:
- rule_id: 3.3.4.(2).tissue_bank_unauthorized_product
  sut_section: 3.3.4
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.4.A.(1)
  condition:
    tissue_bank_unauthorized_product: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Onaylı doku bankası/tek dağıtıcı kapsamı dışı ürün — Kurumca karşılanmaz (§3.3.4(2)).
- rule_id: 3.3.4.(4).dermis_allograft_no_pay
  sut_section: 3.3.4
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.4.A.(3)
  condition:
    material_name_any:
    - dermis allogreft
    - epidermis allogreft
    - dermis xenogreft
    - sentetik greft dermis
    - allogreft dermis
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Dermis/epidermis allogreft-xenogreft-sentetik greft — Kurumca karşılanmaz (§3.3.4(4)).
- rule_id: 3.3.4.(8).open_physis_primary_fracture_graft
  sut_section: 3.3.4
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.4.A.(5)
  condition:
    open_physis_primary_fracture_graft: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Açık epifiz hattı — patolojik olmayan primer kırıkta greft — karşılanmaz (§3.3.4(8)).
- rule_id: 3.3.4.(9).adult_primary_fracture_bone_stimulator
  sut_section: 3.3.4
  deontic: NO_PAY
