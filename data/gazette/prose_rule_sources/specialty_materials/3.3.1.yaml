section_id: 3.3.1
source_note: Exported from specialty_materials_prose.json (YAML source migration)
rules:
- rule_id: 3.3.1.(10).wound_dressing_cover_no_pay
  sut_section: 3.3.1
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.1.(10)
  condition:
    material_name_any:
    - yara ort
    - yara ört
    - transparan film
    - yara temas tabak
    - yapisma
    - yapışma
    - temizlik urunu
    - temizlik ürün
    - bariyer krem
    - bariyer sprey
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Yara örtüsü / bakım yardımcısı — Kurumca karşılanmaz (§3.3.1(10)).
- rule_id: 3.3.1.(10).wound_hydrojel_additive_no_pay
  sut_section: 3.3.1
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.1.(10)
  condition:
    material_name_any:
    - hidrojel
    - yara nemlendir
    - kollagen
    - kolajen
    - buyume faktor
    - büyüme faktör
    - polisakkarid
    - hyaluronik
    - tibbi bal
    - tıbbi bal
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Hidrojel / katkılı yara ürünü — Kurumca karşılanmaz (§3.3.1(10)).
- rule_id: 3.3.1.(10).wound_debridman_no_pay
  sut_section: 3.3.1
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.1.(10)
  condition:
    material_name_any:
    - larva debridman
    - ultrasonik debridman
    - debridman sarf
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Debridman sarf malzemesi — Kurumca karşılanmaz (§3.3.1(10)).
- rule_id: 3.3.1.(10).wound_biostimulation_no_pay
  sut_section: 3.3.1
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.1.(10)
  condition:
    material_name_any:
    - biyostimul
    - topikal oksijen
    - wound biostim
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Biyostimulasyon / topikal oksijen malzemesi — Kurumca karşılanmaz (§3.3.1(10)).
- rule_id: 3.3.1.(10).skin_substitute_non_burn_flag
  sut_section: 3.3.1
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.1.(9)
  condition:
    skin_substitute_non_burn_use: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Deri taklidi/yedeği yalnızca yanık tedavisinde ödenir — diğer endikasyonlarda karşılanmaz 
      (§3.3.1(9)/(10)).
- rule_id: 3.3.1.(10).skin_substitute_keyword_no_pay
  sut_section: 3.3.1
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.1.(9)
  condition:
    material_name_any:
    - deri esdeger
    - deri eşdeğer
    - deri taklit
    - skin substitute
    - deri taklid
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Deri taklidi/yedeği — yanık dışı kullanım şüphesi; yalnızca yanık tedavisinde ödenir (§3.3.1(9)/(10)).
- rule_id: 3.3.1.(13).immunobullous_patient_dispensed
  sut_section: 3.3.1
  deontic: MUST_BILL
  gate_b_sources:
  - 3.3.1.(1)
  condition:
    immunobullous_wound_care_patient_supply: true
  action:
    material_outcome: review_required
    severity: warning
    message_tr: İmmünobüllöz yara bakım malzemesi reçete karşılığı hastaya temin edilmiş — fatura tutarı mahsup/clawback
      (§3.3.1(13)).
- rule_id: 3.3.1.(13).immunobullous_non_moh_supply
  sut_section: 3.3.1
  deontic: MUST_BILL
  gate_b_sources:
  - 3.3.1.(1)
  condition:
    immunobullous_wound_care_non_moh_facility: true
  action:
    material_outcome: review_required
    severity: warning
    message_tr: İmmünobüllöz yara bakım malzemesi yalnızca Sağlık Bakanlığı sunucusunca temin/uygulanmalı (§3.3.1(13)).
- rule_id: 3.3.1.(1).wound_care_saglik_kurulu_must_bill
  sut_section: 3.3.1
  deontic: MUST_BILL
  gate_b_sources:
  - 3.3.1.(1)
  condition:
    material_name_any:
    - yara bakim
    - yara bakım
  action:
    material_outcome: review_required
    severity: info
    message_tr: Yara bakım ürünleri — sağlık kurulu raporuna istinaden Kurumca karşılanır (§3.3.1(1)).
- rule_id: 3.3.1.listede_yer_almasi_zorunlu_regulatory
  sut_section: 3.3.1
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002850
  condition:
    material_name_any:
    - yara bakim
    - yara bakım
  action:
    material_outcome: review_required
    severity: info
    message_tr: Yara bakım ürününün Kurum listesinde/ekinde yer alması zorunludur (§3.3.1).
- rule_id: 3.3.1.(6).ayakta_yara_recete_branş_regulatory
  sut_section: 3.3.1
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - 3.3.1.(6)
  condition:
    material_name_any:
    - yara bakim
    - yara bakım
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Ayakta tedavi yara bakım ürünleri — sağlık kurulu raporuna dayanılarak genel cerrahi / ortopedi ve 
      travmatoloji / plastik cerrahi / geriatri / enfeksiyon / deri uzman hekimlerinden biri tarafından reçete 
      edilmelidir (§3.3.1(6)).
- rule_id: 3.3.1.(8).hydrocolloid_kopuk_fiber_must_bill
  sut_section: 3.3.1
  deontic: MUST_BILL
  gate_b_sources:
  - 3.3.1.(8)
  condition:
    material_name_any:
    - hydrocolloid
    - hidrokolloid
    - kopuk
    - köpük
    - fiber
  action:
    material_outcome: review_required
    severity: info
    message_tr: Ayakta tedavide tedavi edici etkisini sadece hydrocolloid, köpük ve fiber içermesinden gösteren yara 
      bakım ürünleri — Kurumca karşılanır (§3.3.1(8)).
- rule_id: 3.3.1.(9).a.dermis_iskeleti_burn_coverage_must_bill
  sut_section: 3.3.1
  deontic: MUST_BILL
  verification_status: ai_generated_pending_review
  gate_b_sources:
  - C002857
  condition:
    material_name_any:
    - dermis iskeleti
    - dermal scaffold
    - dermal matriks
  action:
    material_outcome: review_required
    severity: info
    message_tr: Dermis iskeleti tam kat dermis hasarli 3. derece yaniklarda yuz/boyun/el/ayak/perine/eklem bölgelerini 
      içeren veya toplamin %40i 0-12 yas %20 astigi yaniklarda yanik merkezi ve 3. basamak saglik kurulu raporuyla 
      karsilanir
- rule_id: 3.3.1.(9).b.deri_benzerleri_burn_coverage_must_bill
  sut_section: 3.3.1
  deontic: MUST_BILL
  verification_status: ai_generated_pending_review
  gate_b_sources:
  - C002858
  condition:
    material_name_any:
    - deri benzeri
    - deri yedegi
    - skin substitute
  action:
    material_outcome: review_required
    severity: info
    message_tr: Deri benzerleri derin 2. ve veya 3. derece yaniklarda enfeksiyon kontaminasyondan koruma amaciyla %40i 
      0-12 yas %20 gecen yaniklarda yanik ünitesi merkezi saglik kurulu raporuyla karsilanir
