section_id: 3.3.6.A-1
source_note: Exported from specialty_materials_prose.json (YAML source migration)
rules:
- rule_id: 3.3.6.A-1.heated_humidifier_nimv_separate
  sut_section: 3.3.6.A-1
  deontic: NO_PAY
  gate_b_sources:
  - 3.3.6.A-1.(10)
  condition:
    nimv_heated_humidifier_separate_billing: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Isıtıcılı nemlendirici NİMV ünitesine dahil — ayrıca karşılanmaz (§3.3.6.A-1).
- rule_id: 3.3.6.A-1.heated_humidifier_keyword
  sut_section: 3.3.6.A-1
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - 3.3.6.A-1.(10)
  condition:
    material_name_any:
    - isitici nemlendirici
    - ısıtıcılı nemlendirici
    - heated humidifier
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Isıtıcılı nemlendirici — NİMV dâhil mi kontrol edilmeli (§3.3.6.A-1).
- rule_id: 3.3.6.A-1.(2).nimv_uyku_merkezi_rapor_regulatory
  sut_section: 3.3.6.A-1
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - 3.3.6.A-1.(2)
  condition:
    material_name_any:
    - nimv
    - nİmv
    - cpap
    - bpap
  action:
    material_outcome: review_required
    severity: warning
    message_tr: NİMV cihazı sağlık kurulu raporları — uyku merkezi bulunan sunucu sağlık kurullarınca; rapor, titrasyon uyku
      testini yapan sunucu tarafından düzenlenmelidir (§3.3.6.A-1(2)).
- rule_id: 3.3.6.A-1.(3).nimv_uc_uzman_recete_regulatory
  sut_section: 3.3.6.A-1
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - 3.3.6.A-1.(3)
  condition:
    material_name_any:
    - nimv
    - nİmv
    - cpap
    - bpap
  action:
    material_outcome: review_required
    severity: warning
    message_tr: NİMV sağlık kurulu raporunda göğüs hastalıkları/psikiyatri/nöroloji uzmanlarından 3 hekim (çocuk hastada çocuk
      göğüs/çocuk nöroloji en az biri) yer alıp reçete etmesi zorunludur (§3.3.6.A-1(3)).
- rule_id: 3.3.6.A-1.nimv_rapor_bilgi_icerik_regulatory
  sut_section: 3.3.6.A-1
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C003064
  condition:
    material_name_any:
    - nimv
    - nİmv
    - cpap
    - bpap
  action:
    material_outcome: review_required
    severity: warning
    message_tr: NİMV sağlık kurulu raporunda zorunlu bilgilerin (cihaz parametreleri, tanı, kullanım süresi vb.) yer alması
      gerekmektedir (§3.3.6.A-1).
- rule_id: 3.3.6.A-1.(7).nimv_kronik_oksijen_must_bill
  sut_section: 3.3.6.A-1
  deontic: MUST_BILL
  gate_b_sources:
  - 3.3.6.A-1.(7)
  condition:
    material_name_any:
    - oksijen konsantratör
    - oksijen cihaz
  action:
    material_outcome: review_required
    severity: info
    message_tr: NİMV kullanımında oksijen saturasyonu %88 üzerine çıkarılamadığı raporda belirtilirse, kronik oksijen tedavisi
      cihaz bedelleri Kurumca karşılanır (§3.3.6.A-1(7)).
- rule_id: 3.3.6.A-1.(8).nimv_dusuk_kullanim_sevk_regulatory
  sut_section: 3.3.6.A-1
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - 3.3.6.A-1.(8)
  condition:
    material_name_any:
    - nimv
    - nİmv
    - cpap
    - bpap
  action:
    material_outcome: review_required
    severity: warning
    message_tr: NİMV cihazının yıllık minimum 1.200 saatin altında kullanıldığının saptanması halinde kullanım saati içeren
      sevk evrakıyla hastanın sevk edilip tedavi devamlılığına ilişkin sağlık kurulu raporu düzenlenmesi gerekmektedir (§3.3.6.A-1(8)).
