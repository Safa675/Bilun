rules:
- rule_id: 2.2.1.B-1.(11).private_daily_visit_cap
  sut_section: 2.2.1.B-1
  condition:
    care_setting: outpatient
    provider_type: private
  action:
    payment_method: itemized
    payment_method_tr: özel kuruluş günlük muayene sınırı — hekim×6 saat temel; hekim başı günlük 60, acil 90, triyaj kırmızı
      toplam 120 (112 Komuta Kontrol ile 120 aşılabilir); 700610/700611 her işlem için 1 muayene düşülür; sınır aşımı Kuruma
      faturalandırılamaz
    daily_visit_cap_basis: physician_hours_x6
    daily_visit_cap_per_physician: 60
    emergency_daily_visit_cap: 90
    triage_red_total_daily_cap: 120
    komuta_kontrol_112_may_exceed_120: true
    transesophageal_echo_codes:
    - "700610"
    - "700611"
    transesophageal_echo_deduct_per_procedure: 1
    over_limit_not_billable: true
  gate_b_sources:
  - C000576
  verification_status: ai_generated_pending_review
  content_note: 'Added the concrete caps dropped from C000576: per-physician 60, emergency 90, triyaj-red total 120, 112 Komuta
    Kontrol may exceed 120, transesophageal echo (700610/700611) deducts 1 muayene each, over-limit not billable.'
- rule_id: 2.2.1.B-1.(2).ten_day_same_specialty_no_visit
  sut_section: 2.2.1.B-1
  condition:
    care_setting: outpatient
    same_provider_same_specialty_within_days: 10
    visit_type_excluded: emergency
  action:
    payment_method: itemized
    payment_method_tr: 10 gün içinde aynı uzmanlık — sadece EK-2/A-2 işlemleri
    visit_fee_annex: EK-2/A-2
    bill_visit_fee: false
  gate_b_sources:
  - C000562
- rule_id: 2.2.1.B-1.(3).deferred_ek2a2_no_second_visit
  sut_section: 2.2.1.B-1
  condition:
    care_setting: outpatient
    procedure_in_annex: EK-2/A-2
    deferred_same_provider: true
  action:
    payment_method: itemized
    payment_method_tr: randevulu EK-2/A-2 işlem — EK-2/A muayene ikinci kez faturalandırılamaz
    bill_visit_fee: false
    visit_fee_annex: EK-2/A
  gate_b_sources:
  - C000563
- rule_id: 2.2.1.B-1.(4).same_day_outpatient_to_inpatient
  sut_section: 2.2.1.B-1
  condition:
    care_setting: inpatient
    same_day_outpatient_visit: true
    procedure_in_annex: EK-2/C
  action:
    payment_method: package
    payment_method_tr: aynı gün ayaktan→yatarak EK-2/C — ayakta işlemler B-1(1) esas
    bill_materials_separately: true
    bill_drugs_separately: true
  gate_b_sources:
  - C000564
- rule_id: 2.2.1.B-1.(5).multi_specialty_same_day_no_visit
  sut_section: 2.2.1.B-1
  condition:
