    payment_method_tr: aynı gün çoklu uzmanlık ayakta sonrası yatarak EK-2/C — EK-2/A muayene faturalandırılamaz
    bill_visit_fee: false
    visit_fee_annex: EK-2/A
  gate_b_sources:
  - C000565
- rule_id: 2.2.1.B-1.(6).followup_specialty_no_visit_fee
