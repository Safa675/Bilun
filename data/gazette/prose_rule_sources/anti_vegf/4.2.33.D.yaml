  content_note: 'Artificial tears (suni gözyaşı) coverage under §4.2.33.D — distinct from the siklosporin rules filed under
    §4.2.33.E. Two prescription paths: specialist/1-yr-report (max 7 drops/day to affected eye) or family doctor (1 box/month,
    no report).'
