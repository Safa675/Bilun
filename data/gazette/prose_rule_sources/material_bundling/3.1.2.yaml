  condition:
    material_invoice_documentation_incomplete: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Fatura eki belge eksik (ruhsatname/sorumlu müdür vb.) — malzeme ödenmez (§3.1.2(b)).
- rule_id: 3.1.2.g.wheelchair_dual_prescription_invalid
  sut_section: 3.1.2
  deontic: NO_PAY
