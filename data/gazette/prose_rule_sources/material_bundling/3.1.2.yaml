    ismarlama_licensed_center_supply_required: true
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Ismarlama protez/ortez veya işitme cihazı — Sağlık Bakanlığı ruhsatlı merkezden temin şartı (§3.1.2(4)(a)).
- rule_id: 3.1.2.(5).ek3c_optional_appropriateness_consumables
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002714
  - C002716
  - C002717
  - C002718
  - C002731
  condition:
    ek3c_optional_appropriateness_consumable: true
  action:
    material_outcome: review_required
    severity: info
