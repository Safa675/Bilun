  gate_b_sources:
  - C002706
  condition:
    ek3c_list_field_definition_scope: true
  action:
    material_outcome: review_required
    severity: info
    message_tr: EK-3/C listelerinde SUT kodu, alan tanımı ve fiyat tanımları geçerlidir — liste eşleşmesi doğrulanmalı (§3.1.2(1)).
- rule_id: 3.1.2.(4)a.ismarlama_licensed_center_supply
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
