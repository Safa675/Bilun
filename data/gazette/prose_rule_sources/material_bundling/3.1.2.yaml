- rule_id: 3.1.2.a.child_growth_miat_renewal_claim
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002726
  condition:
    child_growth_miat_renewal_claim: true
  action:
    material_outcome: review_required
    severity: info
    message_tr: Çocuk büyüme-gelişme MIAT yenileme — sağlık raporu ile erken yenileme koşulları (§3.1.2(a)).
- rule_id: 3.1.2.(1).ek3c_list_field_definitions
  sut_section: 3.1.2
