  condition:
    material_prescription_quantity_exceeded: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Reçete miktarı SUT limitini aşıyor — fazla adet Kurumca karşılanmaz (§3.1.2(6)).
- rule_id: 3.1.2.report_prescription_invalid
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
