      (§3.1.2(5)).
- rule_id: 3.1.2.(14).disabled_veteran_ortez_protez_billing
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002736
  - C002737
  - C002738
  condition:
    disabled_veteran_ortez_protez_billing_review: true
  action:
    material_outcome: review_required
    severity: info
    message_tr: 3713 sayılı Kanun kapsamı malul/vazife malulü ortez-protez — liste fiyatı aşımı ve kapsam doğrulanmalı (§3.1.2(14)).
- rule_id: 3.1.2.(15).terror_victim_ortez_protez_documentation
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002747
  condition:
    terror_victim_ortez_protez_documentation_incomplete: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: 3713/21 olay mağduru ortez-protez — mülki amirlik belgesi fatura ekinde olmalı (§3.1.2(15)).
- rule_id: 3.1.2.(18).prescription_correction_authority
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002750
  condition:
    material_prescription_correction_invalid: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Reçete/rapor düzeltmesi yetkili hekim tarafından yapılmalı (§3.1.2(18)).
