section_id: 3.1.2
source_note: Exported from material_bundling_prose.json (YAML source migration)
rules:
- rule_id: 3.1.2.c.warranty_maintenance
  sut_section: 3.1.2
  deontic: MUST_NOT_BILL
  condition:
    material_name_any:
    - garanti kapsam
    - garanti süresi
    - garanti suresi
    - bakım onarım
    - bakim onarim
    - bakım ve onarım masrafları
    - bakim ve onarim masraflari
    - firma tarafından karşılan
    - firma tarafindan karsilan
  action:
    material_outcome: must_not_bill_separately
    severity: warning
    message_tr: Garanti kapsamındaki bakım/onarım — ayrıca faturalandırılamaz (§3.1.2(c)).
  gate_b_sources:
  - C002741
- rule_id: 3.1.2.(2).not_in_ek3c
  sut_section: 3.1.2
  deontic: NO_PAY
  condition:
    material_not_in_ek3c: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Malzeme kodu EK-3/C listelerinde yok — Kurumca karşılanmaz (§3.1.2(2)).
  gate_b_sources:
  - C002707
- rule_id: 3.1.2.(2).not_in_ek3
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002824
  - C002828
  - C002831
  condition:
    material_not_in_ek3: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Malzeme kodu EK-3 uzmanlık listelerinde yok — Kurumca karşılanmaz (§3.2.1 / §3.1.2).
- rule_id: 3.1.2.(7).lost_stolen_miat
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002720
  condition:
    material_name_any:
    - kaybolması
    - kaybolmasi
    - çalınması
    - calinmasi
    - çalıntı
    - calinti
  action:
    material_outcome: no_pay
    severity: warning
    message_tr: Kayıp/çalıntı sonrası MIAT dolana kadar yeni malzeme ödenmez (§3.1.2(7)).
- rule_id: 3.1.2.c.onarim_not_covered
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002724
  condition:
    material_name_any:
    - kullanım kurallarına uyulmaması
    - kullanim kurallarina uyulmamasi
    - onarım masraf
    - onarim masraf
  action:
    material_outcome: no_pay
    severity: warning
    message_tr: Kullanım kuralı ihlali onarım masrafı — Kurumca karşılanmaz (§3.1.2(c)).
- rule_id: 3.1.2.ç.garanti_renewal_denied
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002742
  condition:
    material_name_any:
    - garanti süresi içindeki yenilenme
    - garanti suresi icindeki yenilenme
  action:
    material_outcome: no_pay
    severity: warning
    message_tr: Garanti süresi içi yenileme talebi — Kurumca karşılanmaz (§3.1.2(ç)).
- rule_id: 3.1.2.d.duplicate_function_garanty
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002743
  condition:
    material_name_any:
    - aynı işlevi gören
    - ayni islevi goren
    - birden fazla ürün çeşidi
  action:
    material_outcome: no_pay
    severity: warning
    message_tr: Aynı işlevli alternatif ürün — garanti süresi dolana kadar diğerleri ödenmez (§3.1.2(d)).
- rule_id: 3.1.2.(17).device_consumable_excluded
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002749
  condition:
    material_name_any:
    - karşılanmayan tıbbi cihaz
    - karsilanmayan tibbi cihaz
    - cihaza ait sarf
    - cihaz sarf
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Karşılanmayan cihaza ait sarf/bakım — Kurumca karşılanmaz (§3.1.2(17)).
- rule_id: 3.1.2.b.ortez_protez_contract_billing_invalid
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002740
  condition:
    ortez_protez_contract_billing_invalid: true
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Özel sözleşme yolu ortez/protez faturalandırması — komisyon tespiti ve sözleşme kapsamı doğrulanmalı (§3.1.2(b)).
- rule_id: 3.1.2.(11).maintenance_cost_cap_exceeded
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002732
  - C002733
  condition:
    maintenance_cost_exceeds_sut_cap: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: Bakım/onarım toplam bedeli malzeme bedelinin %75'ini geçemez (§3.1.2(11)).
- rule_id: 3.1.2.(8).protez_repair_documentation_incomplete
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002727
  - C002728
  - C002729
  - C002744
  condition:
    protez_repair_documentation_incomplete: true
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Protez/ortez MIAT veya yenileme talebi — sağlık raporu/kurul belgesi gerekir (§3.1.2(8)).
- rule_id: 3.1.2.(8).warranty_maintenance_procedure_incomplete
  sut_section: 3.1.2
  deontic: MANDATORY
  gate_b_sources:
  - C002723
  condition:
    warranty_maintenance_procedure_incomplete: true
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Garanti içi/dışı bakım-onarım başvuru prosedürü tamamlanmamış (§3.1.2(8)(b)).
- rule_id: 3.1.2.(8).ortez_protez_maintenance_unverified
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002721
  - C002722
  condition:
    ortez_protez_maintenance_unverified: true
  action:
    material_outcome: review_required
    severity: info
    message_tr: Ortez/protez bakım-onarım — garanti kapsamı ve Kurum tespiti doğrulanmalı (§3.1.2(8)).
- rule_id: 3.1.2.(9).ek3c_miat_early_renewal_unauthorized
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002725
  condition:
    ek3c_miat_early_renewal_unauthorized: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: EK-3/C-2/C-3 malzemesi MIAT süresi dolmadan yenilenemez (§3.1.2(9)).
- rule_id: 3.1.2.(4).ek3c_custom_order_billing_invalid
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002709
  condition:
    ek3c_custom_order_billing_invalid: true
  action:
    material_outcome: review_required
    severity: warning
    message_tr: EK-3/C 'I' (ısmarlama) malzemesi — kişiye özel üretim kuralları doğrulanmalı (§3.1.2(4)).
- rule_id: 3.1.2.(5).ek3c_medical_appropriateness_incomplete
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
  - C002713
  condition:
    ek3c_medical_appropriateness_incomplete: true
  action:
    material_outcome: no_pay
    severity: error
    message_tr: EK-3/C-1 malzemesi için tıbbi uygunluk/rapor takibi tamamlanmamış (§3.1.2(5)).
- rule_id: 3.1.2.c.ek3c_custom_garment_contract_invalid
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002712
  condition:
    ek3c_custom_garment_contract_invalid: true
  action:
    material_outcome: review_required
    severity: warning
    message_tr: Lenfödem/yanık bası giysisi (ısmarlama) — sözleşme yolu doğrulanmalı (§3.1.2(c)).
- rule_id: 3.1.2.(13).ek3c_force_majeure_renewal_claim
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002735
  condition:
    ek3c_force_majeure_renewal_claim: true
  action:
    material_outcome: review_required
    severity: info
    message_tr: Mücbir sebep belgeli EK-3/C yenileme — kullanım süresine bakılmaksızın yenileme yolu (§3.1.2(13)).
- rule_id: 3.1.2.(1).ek3c_outpatient_material_scope
  sut_section: 3.1.2
  deontic: REGULATORY_ACTION
  gate_b_sources:
  - C002700
  condition:
    ek3c_outpatient_material_scope: true
  action:
    material_outcome: review_required
    severity: info
    message_tr: Ayakta tedavi EK-3/C listesi kapsamı — ilgili geri ödeme kuralları geçerlidir (§3.1.2(1)).
- rule_id: 3.1.2.(6).prescription_quantity_exceeded
  sut_section: 3.1.2
  deontic: NO_PAY
  gate_b_sources:
