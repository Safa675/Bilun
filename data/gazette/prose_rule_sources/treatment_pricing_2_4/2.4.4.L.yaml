- rule_id: 2.4.4.L.(2).diskoplasty_3_specialty_board_report_required
  sut_section: 2.4.4.L
  condition:
    procedure_code_any:
    - P551120
    - P615895
    - P615991
    health_board_report_present: false
  action:
    billable: false
    enforcement: documentation_required
    message_tr: transsakral girişimle kamera eşliğinde lomber epidural diskoplasti/adezyolizis/nöroplasti amaçlı işlemlerin
      yapılabilmesi için algoloji, nöroloji, fiziksel tıp ve rehabilitasyon, ortopedi ve travmatoloji ile beyin cerrahisi
      branşlarından herhangi üç uzman hekim tarafından oluşturulan sağlık kurulu raporu düzenlenmesi gerekir
    severity: error
  gate_b_sources:
  - 2.4.4.L.(2)#614505f8
- rule_id: 2.4.4.L.(3).diskoplasty_covered_when_conditions_met
  sut_section: 2.4.4.L
  condition:
