    - P551120
    - P615895
    - P615991
    conditions_met: true
  action:
    billable: true
    enforcement: coverage
    message_tr: uygun şartlarda yapılan işlemin bedeli Kurumca karşılanır
  gate_b_sources:
  - C001379
