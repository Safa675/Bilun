rules:
- rule_id: 2.4.4.L.(1).diskoplasty_ek2c_3rd_step_only
  sut_section: 2.4.4.L
  condition:
    procedure_code_any:
    - P551120
    - P615895
    - P615991
    billing_basis: other
  action:
    billable: true
    enforcement: pricing_basis
    message_tr: P551120, P615895 ve P615991 kodlu işlemler sadece SUT EK-2/C Listesinde belirtilen puanlar üzerinden faturalandırılır;
      bedelleri algoloji, beyin cerrahisi ve ortopedi ve travmatoloji branş hekimlerince üçüncü basamak sunucularında yapılması
      halinde Kurumca karşılanır
