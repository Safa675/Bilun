rules:
- rule_id: 2.4.1.B-2.(1).disabled_or_special_need_child_ek2c_fee
  sut_section: 2.4.1.B-2
  condition:
    patient_disabled_40pct_or_special_need_child: true
    facility_type_any:
    - private_provider
    - uncontracted_public_provider
    procedure_in_ek2c_list: true
  action:
