section_id: 2.4.4.P
source_note: Exported from treatment_pricing_2_4.json (YAML source migration)
rules:
- rule_id: 2.4.4.P.(2).psma_castration_resistant_metastatic_diagnosis
  sut_section: 2.4.4.P
  condition:
    procedure_category: lu177_psma_therapy
    diagnosis_is: progressive_castration_resistant_metastatic_prostate_ca
    diagnosis_on_board_report: false
  action:
    billable: false
    enforcement: documentation_required
    message_tr: sağlık kurulu raporunda progrese, kastrasyona dirençli metastatik prostat kanseri tanısının bulunması gerekir
    severity: error
  gate_b_sources:
  - 2.4.4.P-1.(2)
- rule_id: 2.4.4.P.(3).psma_testosterone_under_50_psa_not_criteria
  sut_section: 2.4.4.P
  condition:
    procedure_category: lu177_psma_therapy
    testosterone_ng_dl:
      min: 50
  action:
    billable: false
    enforcement: pre_treatment_lab_gate
    message_tr: tedavi öncesinde kan testesteron düzeyinin 50 ng/dl altında olması gerekir; tedaviye başlanması için PSA değeri
      kriter değildir
    severity: error
  gate_b_sources:
  - 2.4.4.P-1.(3)
- rule_id: 2.4.4.P.(5).psma_ga68_pet_min3_foci_above_liver
  sut_section: 2.4.4.P
  condition:
    procedure_category: lu177_psma_therapy
    prior_ga68_psma_pet: false
    ga68_psma_pet_foci_above_liver:
      min: 3
  action:
    billable: false
    enforcement: pre_treatment_imaging_gate
    message_tr: Lu-177 işaretli PSMA bileşikleri ile tedavisi öncesinde Ga-68 PSMA PET görüntülemenin mutlaka yapılmış olması
      ve en az 3 odakta karaciğerden daha yüksek düzeyde patolojik tutulumun bulunması gerekir
    severity: error
  gate_b_sources:
  - 2.4.4.P-1.(5)
- rule_id: 2.4.4.P.(6).psma_min6week_gap_8_or_12_doses_with_report
  sut_section: 2.4.4.P
  condition:
    procedure_category: lu177_psma_therapy
    weeks_between_cycles:
      max: 5
  action:
    billable: false
    enforcement: frequency_and_cycle_cap
    message_tr: tedavi en az 6 hafta ara ile uygulanır; nükleer tıp uzmanı tarafından gerekçeli raporla en fazla 8 doz; klinik
      fayda gören hastalarda nükleer tıp + tıbbi onkoloji uzmanlı üç imzalı gerekçeli sağlık kurulu raporu ile 12 doza kadar
      uygulanabilir
    severity: error
  gate_b_sources:
  - 2.4.4.P-1.(6)
- rule_id: 2.4.4.P.(1).psma_3sign_board_nuc_plus_onc
  sut_section: 2.4.4.P
  verification_status: ai_generated_pending_review
  condition:
    procedure_category: lu177_psma_therapy
    board_signatures_count:
      min: 3
    board_includes_nuclear_medicine: false
    board_includes_medical_oncology: false
  action:
    billable: false
    enforcement: documentation_required
    message_tr: En az bir nukleer tip ve bir tibbi onkoloji uzmani olmak sartiyla uc imzali tibbi gerekceli saglik kurulu
      raporu bulunmalidir
    severity: error
  gate_b_sources:
  - 2.4.4.P-1.(1)
