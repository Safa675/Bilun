section_id: 2.4.4.İ-1
source_note: Exported from treatment_pricing_2_4.json (YAML source migration)
rules:
- rule_id: 2.4.4.I-1.(1).ivf_ek2c_package_price
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf
  action:
    billable: true
    payment_tr: IVF EK-2/C bedel üzerinden (ovulasyon takibi, oosit aspirasyonu, ICSI vb. dahil)
    annex_basis: EK-2/C
  gate_b_sources:
  - C001296
- rule_id: 2.4.4.I-1.(2).ivf_age40_no_pay
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf
    patient_age_at_embryo_transfer:
      min: 40
    valid_report_before_age40: false
    embryo_transfer_within_30_days_of_report: false
  action:
    billable: false
    denial_tr: embriyo transferi tarihinde kadının 40 yaşından büyük olması ve 40'tan küçükken geçerli rapor yoksa IVF bedelleri
      ödenmez
    severity: error
  gate_b_sources:
  - C001261
- rule_id: 2.4.4.I-1.(2).ivf_freezing_ek2b
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf_embryo_freezing
    attempt_number:
      min: 1
      max: 2
  action:
    billable: true
    payment_tr: embriyo freezing 1. veya 2. denemeden sonra EK-2/B üzerinden
    annex_basis: EK-2/B
  gate_b_sources:
  - C001297
- rule_id: 2.4.4.I-1.(3).ivf_cancellation_10pct_discount
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf
    ivf_not_completed: true
  action:
    billable: true
    payment_tr: IVF uygulanamazsa kadar yapılan işlemler EK-2/B üzerinden %10 indirimli
    annex_basis: EK-2/B
    discount_fraction: 0.1
  gate_b_sources:
  - C001298
- rule_id: 2.4.4.I-1.(5).ivf_multi_embryo_multi_birth_no_pay
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf
    multiple_embryos_transferred_without_medical_necessity: true
    multiple_births_resulted: true
  action:
    billable: false
    denial_tr: tıbbi zorunluluk olmadan birden fazla embriyo transferi ile oluşan çoklu doğumlarda bebeklere ait taburcuğı
      kadar bedeller ödenmez
    severity: error
  gate_b_sources:
  - C001300
- rule_id: 2.4.4.I-1.(1).ivf_married_no_child_max_3_cycles
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf_art
    patient_married: true
    has_child_in_current_marriage: false
    ivf_cycles_lifetime:
      min: 4
  action:
    billable: false
    enforcement: cycle_cap
    message_tr: evli olup mevcut evliliğinde çocuğu olmayan genel sağlık sigortalısına en fazla üç deneme (siklus) ile sınırlı
      olmak üzere uygulanan IVF tedavilerine ilişkin giderler, şartların birlikte gerçekleşmesi halinde Kurumca karşılanır
    severity: error
  gate_b_sources:
  - C001255
- rule_id: 2.4.4.I-1.(1d).ivf_3yr_other_methods_unsuccessful_documented
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf_art
    diagnosis_not_in:
    - primary_ovarian_failure
    - male_azoospermia
    other_methods_unsuccessful_within_3y_documented: false
  action:
    billable: false
    enforcement: documentation_required
    message_tr: kadının primer ovaryan yetmezliği ve erkeğin azoospermisi hâlleri hariç, son üç yıl içinde diğer tedavi yöntemlerinden
      sonuç alınamamış olduğunun sözleşmeli/protokollü sunucu sağlık kurullarınca belgelenmesi gerekir
    severity: error
  gate_b_sources:
  - C001260
- rule_id: 2.4.4.I-1.(3).ivf_prior_cycles_counted
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf_art
    prior_ivf_paid_by_transferred_agency: true
    prior_cycles_counted_in_total: false
  action:
    billable: false
    enforcement: cycle_accounting
    message_tr: Kuruma devredilen sosyal güvenlik kurumlarınca daha önce ödenen tüp bebek tedavileri, işlem adetlerinin hesaplanmalarında
      dikkate alınır
    severity: error
  gate_b_sources:
  - C001262
- rule_id: 2.4.4.I-1.(4).ivf_report_conditions_specified
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf_art
    ivf_report_conditions_specified: false
  action:
    billable: false
    enforcement: documentation_required
    message_tr: sağlık kurulu raporunda IVF için gerekli şartların belirtilmiş olması gereklidir
    severity: error
  gate_b_sources:
  - C001284
- rule_id: 2.4.4.I-1.(5).ivf_apply_within_6mo_or_new_report
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf_art
    months_from_report_to_application:
      min: 7
  action:
    billable: false
    enforcement: report_validity
    message_tr: sağlık kurulu raporunun düzenlendiği tarihten itibaren 6 ay içinde IVF uygulamasının yapılmaması halinde yeniden
      sağlık kurulu raporu düzenlenmesi gereklidir; bu sürede temin edilen ilaçlar maksimum doz hesabında dikkate alınır
    severity: error
  gate_b_sources:
  - C001293
- rule_id: 2.4.4.I-1.(6).ivf_separate_board_report_per_treatment
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf_art
    health_board_report_present: false
  action:
    billable: false
    enforcement: documentation_required
    message_tr: her bir IVF tedavisi (ve ikinci tedavi) için sağlık kurulu raporu düzenlenmesi gereklidir
    severity: error
  gate_b_sources:
  - C001294
- rule_id: 2.4.4.I-1.(3c).ivf_not_performed_10pct_discount_ek2b
  sut_section: 2.4.4.İ-1
  condition:
    procedure_category: ivf_art
    ivf_not_performed: true
    billing_basis: other
  action:
    billable: true
    enforcement: pricing_basis
    message_tr: hastaya IVF uygulamasının yapılamaması durumunda; o süreye kadar yapılan işlemler EK-2/B Listesi üzerinden
      %10 indirim yapılarak faturalandırılır; bu işlemler deneme sayısına dâhil edilmez; kullanılan ilaçlar maksimum doz hesabında
      dikkate alınır
    annex_basis: EK-2/B
  gate_b_sources:
  - C001299
