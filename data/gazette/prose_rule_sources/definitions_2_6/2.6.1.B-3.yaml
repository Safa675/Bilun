section_id: 2.6.1.B-3
rules:
- rule_id: 2.6.1.B-3.(1b).non_routine_travel_accepted
  sut_section: 2.6.1.B-3
  gate_b_sources:
  - C001585
  condition:
    definition_scope: Mutat taşıt dışı naklin Kurumca kabulü halinde yol giderinin ödenmesi
    applies_to: Mutat taşıt dışı nakil
  action:
    enforcement: gate
    message_tr: Mutat taşıt dışı nakil, Kurumca kabul edilmesi durumunda yol gideri ödenir.
- rule_id: 2.6.1.B-3.(2b).dialysis_transport_health_board_specialist
  sut_section: 2.6.1.B-3
  gate_b_sources:
  - 2.6.1.B-3.b
  condition:
    definition_scope: Diyaliz nakli sağlık kurulu raporunda nefroloji/iç/çocuk uzmanı bulunması ve 3 ay geçerli
    applies_to: Diyaliz tedavisi — mutat taşıt dışı nakil
    report_validity_months: 3
  action:
    enforcement: gate
    message_tr: Diyaliz mutat taşıt dışı nakli sağlık kurulu raporunda en az bir erişkin/çocuk nefroloji uzmanı (yoksa sertifikalı
      iç/çocuk hast. uzmanı) bulunmalı; rapor 3 ay geçerlidir.
- rule_id: 2.6.1.B-3.(3).vehicle_allocated_escort_no_travel
  sut_section: 2.6.1.B-3
  gate_b_sources:
  - 2.6.1.B-3.(3)
  condition:
    expense_not_covered: vasita_tahsis_edilen_refakatci_yol_gideri
    applies_to: Bir vasıta tahsis edilerek gönderilen GSS'li ve bakmakla yükümlü olunan kişiler
  action:
    enforcement: reject
    message_tr: Genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişiler, kendilerine bir vasıta tahsis edilmesi suretiyle
      başka bir yere gönderilmiş iseler, eşlik eden refakatçiye ayrıca yol gideri ödenmez.
