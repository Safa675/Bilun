section_id: 2.6.1.B-4
rules:
- rule_id: 2.6.1.B-4.(1).non_routine_invoice_required
  sut_section: 2.6.1.B-4
  gate_b_sources:
  - 2.6.1.B-4.(1)
  condition:
    definition_scope: Mutat taşıt dışı araçla sevkte bilet/fatura ibraz zorunluluğu
    applies_to: Mutat taşıt dışı sevk
  action:
    enforcement: gate
    message_tr: Mutat taşıt dışı araçla sevkte bilet/fatura ibrazı zorunludur; ibraz edilemezse mutat taşıt bedeli üzerinden
      ödeme yapılır.
- rule_id: 2.6.1.B-4.(2).private_vehicle_routine_fee
  sut_section: 2.6.1.B-4
  gate_b_sources:
  - 2.6.1.B-4.(2)
  condition:
    definition_scope: Kişilerin özel araçları ile gidiş/dönüşünde mutat taşıt ücreti ödenmesi
    applies_to: Özel araç ile sevk
  action:
    enforcement: gate
    message_tr: Kişilerin özel araçları ile sağlık hizmeti sunucusuna gidiş/dönüşünde mutat taşıt ücreti ödenir.
- rule_id: 2.6.1.B-4.(4).scheduled_air_economy_plus_boarding
  sut_section: 2.6.1.B-4
  gate_b_sources:
  - 2.6.1.B-4.(4)
  condition:
    definition_scope: Tarifeli uçak için ekonomi sınıf bedeli + uçak seyahatini teyitleme (biniş/QR)
    applies_to: Uçak ile sevk
  action:
    enforcement: gate
    message_tr: Tarifeli uçak için ibraz edilen bilet/fatura tutarı ekonomi sınıf bedeli üzerinden ödenir; uçak sevklerinde
      fatura/bilet yanında biniş kartı veya eşleşen QR çıktısı ibraz edilmelidir.
- rule_id: 2.6.1.B-4.(5).ground_ambulance_min_price
  sut_section: 2.6.1.B-4
  gate_b_sources:
  - 2.6.1.B-4.(5)
  condition:
    definition_scope: Kara ambulansı/hasta nakil aracı ücretinin yönetmelik asgari fiyatları esas alınması
    applies_to: Kara ambulansı / hasta nakil aracı
  action:
    enforcement: gate
    message_tr: Kara ambulansı/nakil aracı ücreti, Ambulanslar Yönetmeliği md.28 asgari fiyatları esas alınır; resmi tarifenin
      altındaki faturada fatura bedeli üzerinden ödenir.
- rule_id: 2.6.1.B-4.(6).air_ambulance_scoped
  sut_section: 2.6.1.B-4
  gate_b_sources:
  - 2.6.1.B-4.(6)
  condition:
    definition_scope: Hava ambulansının yalnızca uzuv replantasyonu/2.4.2 kapsamı ile ödenmesi + kule/ucucu kayıt
    applies_to: Hava ambulansı / özel hava taşıtı
    scopes:
    - uzuv_replantasyonu_acil
    - 2.4.2_kapsami
    - organ_doku_nakli
  action:
    enforcement: gate
    message_tr: Hava ambulansı yalnızca uzuv replantasyonu gerektiren acil hizmet ve 2.4.2 kapsamı için ödenir; ödemede ilk
      kule teması 'ambulans görevi' ile kurulmuş ve uçucu/teknik kayıtlar ibraz edilmelidir.
- rule_id: 2.6.1.B-4.(7).funeral_vehicle_municipal_tariff
  sut_section: 2.6.1.B-4
  gate_b_sources:
  - 2.6.1.B-4.(7)
  condition:
    definition_scope: Cenaze nakil aracı ücretinin ilgili belediye tarifesi üzerinden ödenmesi
    applies_to: Cenaze nakil aracı
  action:
    enforcement: gate
    message_tr: Cenaze nakil aracı ücreti, ilgili belediyece onaylanan ücret tarifesi üzerinden fatura tutarını aşmamak kaydıyla
      Kurumca karşılanır.
- rule_id: 2.6.1.B-4.(3).commercial_taxi_capped_5x_routine
  sut_section: 2.6.1.B-4
  verification_status: ai_generated_pending_review
  gate_b_sources:
  - 2.6.1.B-4.(3)
  condition:
    definition_scope: Ticari taksi için ödenecek ücretin mutat taşıt ücretinin 5 katını geçememesi
    applies_to: Ticari taksi ile nakil
    fee_cap_multiplier: 5.0
  action:
    enforcement: gate
    message_tr: Ticari taksi için ödenecek ücret, ilgili yerleşim yerleri arası mutat taşıt ücreti bedelinin 5 katını geçemez.
- rule_id: 2.6.1.B-4.(6b).air_ambulance_tariff_table
  sut_section: 2.6.1.B-4
  verification_status: ai_generated_pending_review
  gate_b_sources:
  - 2.6.1.B-4.a
  - C001595
  - C001596
  - 2.6.1.B-4.b
  - C001598
  - C001599
  - C001600
  - C001601
  condition:
    definition_scope: Hava/deniz ambulansı uçuş/seyir saati başına TL+KDV tarife
    applies_to: Hava/deniz ambulansı ücretleri
    tariff_tl_per_hour_plus_kdv:
      turbo_prop_aircraft: 2000
      jet_aircraft: 3500
      single_engine_helicopter: 1500
      twin_engine_helicopter: 2750
      sea_ambulance: 1500
  action:
    enforcement: gate
    message_tr: Ambulans ücretleri (gidiş-dönüş, saat başına, KDV hariç) — turbo-prop uçak 2.000 TL, jet 3.500 TL, tek motorlu
      helikopter 1.500 TL, çift motorlu helikopter 2.750 TL, deniz ambulansı 1.500 TL üzerinden ödenir.
