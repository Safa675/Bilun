  condition:
    coverage_note: true
  action:
    enforcement: 4 haftalık tedavi sonrası yanıt alınan ve tedavinin devamı gereken hastalarda; 2./3. basamakta ilgili uzmanlardan
      üçünün yer aldığı 4 hafta süreli uzman hekim raporuyla yine bu uzmanlarca 4 haftalık dozda reçete edilirse ödenir
    message_tr: 4 (dört) haftalık tedavi sonrasında yanıt alınan hastalarda tedavinin devamının gerekmesi halinde; ikinci
      basamak ya da üçüncü basamak resmi sağlık hizmeti sunucularında enfeksiyon hastalıkları ve klinik mikrobiyoloji, kalp
      ve damar cerrahisi, ortopedi ve travmatoloji, plastik, rekonstrüktif ve estetik cerrahi, endokrinoloji ve metabolizma
      hastalıkları veya genel cerrahi uzman hekimlerince düzenlenen 4 (dört) hafta süreli uzman hekim raporuna istinaden yine
      bu uzman hekimler tarafından 4 (dört) haftalık dozda reçete edilmesi halinde bedelleri Kurumca karşılanır (§4.2.65).
