  drug_names:
  - posakonazol
  report_required: true
  action:
    enforcement: posakonazol'ün parenteral formları yalnızca oral formlarını kullanamayan hastalarda kullanılabilir; invazif
      mantar enfeksiyonu profilaksisi endikasyonu
    message_tr: Belirtilen hastalardaki invazif mantar enfeksiyonlarının profilaksisinde kullanılır. Posakonazol'ün parenteral
      formları yalnızca oral formlarını kullanamayan hastalarda kullanılabilir (§4.2.23).
