- rule_id: 4.2.35.A.capsaicin_phn_dpn_arthritis_nopay
  sut_section: 4.2.35.A
  gate_b_sources:
  - C006699
  drug_names:
  - kapsaisin
  icd10_codes:
  - B02
  - G63.2
  - M13
  - M15
  - M79
  report_required: true
  prescriber_specialties:
  - tüm hekimler
  condition:
    coverage_note: true
  action:
    enforcement: kapsaisin mono krem yalnızca açık deri lezyonları iyileştikten sonra postherpetik nevralji/ağrılı diyabetik
      periferik polinöropati semptomatik tedavisinde ilgili uzman/uzman raporuyla ödenir; artrit/osteoartrit/kas-eklem ağrısında
      reçete edilirse ödenmez
    message_tr: Kapsaisin etken maddesini mono olarak krem formunda içeren ürünlerin yalnızca açık deri lezyonlarının iyileşmesinden
      sonra herpes zoster enfeksiyonlarına eşlik veya takip eden nevraljinin (postherpetik nevralji) veya ağrılı diyabetik
      periferik polinöropatinin semptomatik tedavisinde ilgili uzman hekimce/uzman raporuyla tüm hekimlerce reçete edilmesi
      halinde bedeli ödenir; artrit, osteoartrit, kas ve eklem ağrılarının semptomatik tedavisinde reçete edilmesi halinde
      bedeli Kurumca karşılanmaz (§4.2.35.A).
