  - gabapentin
  - pregabalin
  - duloksetin
  icd10_codes:
  - E10
  - E11
  - G63.2
  - G63.9
  report_required: true
  prescriber_specialties:
  - tüm hekimler
  condition:
    coverage_note: true
  action:
    enforcement: diyabetik nöropatik ağrı/periferal diyabetik polinöropati tedavisinde ilgili uzman hekimce veya uzman raporuyla
      tüm hekimlerce reçete edilebilir
    message_tr: Diyabetik nöropatik ağrı ve periferal diyabetik polinöropati semptomlarının tedavisinde; nöroloji, beyin cerrahisi,
      fiziksel tıp ve rehabilitasyon, anestezi ve reanimasyon, immünoloji, romatoloji, iç hastalıkları veya endokrinoloji
      ve metabolizma hastalıkları uzman hekimi tarafından veya bu uzman hekimlerden birinin düzenlediği uzman hekim raporuna
      dayanılarak tüm hekimlerce reçete edilebilir (§4.2.35.A).
