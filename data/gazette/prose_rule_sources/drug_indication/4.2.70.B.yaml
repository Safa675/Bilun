  report_required: true
  report_duration_months: 6
  action:
    enforcement: 3 ay sonra hastalık evresi değişmedi (ev dışında desteksiz yürüme devam) raporda belirtilirse 6 aylık idame
      raporuyla devam; her raporda bu durum belirtilmeli; evre 2'ye geçişte (yürümede destek gereksinimi) tedavi sonlandırılır
    message_tr: 3 ay sonra yapılan değerlendirmede klinik olarak hastalık evresinin değişmediğinin (hastanın ev dışında desteksiz
      yürümeye devam ettiği) raporda belirtilmesi halinde 6 aylık idame rapor ile tedaviye devam edilebilir. Rapor süresinin
      sonunda her raporda hastalık evresinin değişmediği belirtilmelidir. Tedavi, hastalığın evre 2'ye geçmesi (yürüme için
      desteğe ihtiyaç duyulması) halinde sonlandırılır (§4.2.70.B).
