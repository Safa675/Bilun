- rule_id: 4.2.13.3.2.B.bucket_b.C004920
  sut_section: 4.2.13.3.2.B
  drug_names:
  - genotip 1
  gate_b_sources:
  - C004982
  report_required: true
  message_tr: Genotip 1, 2, 4, 5 ve 6 kompanse sirozu olan NS5A inhibitörü veya proteaz inhibitörü tedavisi almamış
    hastalarda toplam 12 hafta;
  encode_bucket: B
  required_biomarkers:
  - marker: HCV_GENOTYPE
    status_any:
    - '1'
    - '2'
    - '3'
- rule_id: 4.2.13.3.2.B.bucket_b.C004922
