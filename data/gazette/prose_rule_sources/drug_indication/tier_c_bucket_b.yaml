section_id: tier_c_bucket_b
source_note: Tier-C Bucket B — biomarker / prior-therapy gating (DrugClaimLine fields)
rules:
- rule_id: 4.2.1.C-2.bucket_b.C003650
  sut_section: 4.2.1.C-2
  drug_names:
  - lama
  gate_b_sources:
  - C003650
  report_required: true
  message_tr: (2) Siklofosfamide dirençli veya siklofosfamid tedavisi verilemeyen ciddi, aktif granulamatoz polianjitis (GPA/
    Wegener granülomatozu) ve mikroskobik polianjitis (MPA) hastalarının tedavisinde glukokortikoidlerle kombine olarak;
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: prior_therapy
    outcome: resistant
- rule_id: 4.2.9.Ç.bucket_b.C004176
  sut_section: 4.2.9.Ç
  drug_names:
  - bifosfonat
  - albumin
  gate_b_sources:
  - C004176
  report_required: true
  message_tr: b) Opere olmuş ancak nüks olan hastalardan; bifosfonatlar ile hiperkalsemisi kontrol altına alınamamış ve albümin
    ile düzeltilmiş serum kalsiyum değeri ≥10,5 mg/dl olan hastalar,
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: prior_therapy
    outcome: relapse
- rule_id: 4.2.13.3.2.B.bucket_b.C004920
  sut_section: 4.2.13.3.2.B
  drug_names:
  - genotip 1
  gate_b_sources:
  - C004920
  report_required: true
  message_tr: Genotip 1, 2, 4, 5 ve 6 kompanse sirozu olan NS5A inhibitörü veya proteaz inhibitörü tedavisi almamış hastalarda
    toplam 12 hafta;
  encode_bucket: B
  required_biomarkers:
  - marker: HCV_GENOTYPE
    status_any:
    - '1'
    - '2'
    - '3'
- rule_id: 4.2.13.3.2.B.bucket_b.C004922
  sut_section: 4.2.13.3.2.B
  drug_names:
  - hepatit c tedavisi
  - antiviral
  gate_b_sources:
  - C004922
  report_required: true
  message_tr: Genotip 1 nonsirotik ya da kompanse sirozu olan daha önceden proteaz inhibitörü kullanmış fakat NS5A inhibitörü
    almamış hastalarda 12 hafta;
  encode_bucket: B
  required_biomarkers:
  - marker: HCV_GENOTYPE
    status_any:
    - '1'
    - '2'
    - '3'
- rule_id: 4.2.21.bucket_b.C006083
  sut_section: 4.2.21
  drug_names:
  - hidroksiüre
  gate_b_sources:
  - C006083
  report_required: true
  message_tr: (1) Hidroksiüre + asetil salisilik asit tedavisine dirençli olduğu ya da hidroksiüre ile dirençli sitopeni (anemi
    ve/veya lökopeni) geliştiği belgelenen, yüksek vasküler risk taşıyan esansiyel trombositemi hastalıklarında, hematoloji
    veya tıbbi onkoloji uzman hekimlerinden biri tarafından düzenlenen uzman hekim raporuna dayanılarak bu uzman hekimler
    tarafından reçete edilebilir.
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: prior_therapy
    outcome: resistant
- rule_id: 4.2.23.bucket_b.C006102
  sut_section: 4.2.23
  drug_names:
  - amfoterisin
  gate_b_sources:
  - C006102
  - C006118
  report_required: true
  message_tr: 3) Amfoterisin B ile tedaviye refrakter ya da amfoterisin B’yi tolere edemeyen fusariozis hastalığı olan hastalarda.
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: prior_therapy
    outcome: refractory_or_intolerant
- rule_id: 4.2.30.A.bucket_b.C006411
  sut_section: 4.2.30.A
  drug_names:
  - cerrahi
  - sama
  gate_b_sources:
  - C006411
  report_required: true
  message_tr: (4) İlgili ilaçlar üçüncü basamak sağlık hizmeti sunucularında bu durumların belirtildiği kardiyoloji, kalp
    damar cerrahisi, göğüs hastalıkları, çocuk kardiyolojisi uzman hekimlerinden birinin yer aldığı 3 ay süreli sağlık kurulu
    raporuna dayanılarak belirtilen hekimlerce reçete edilir.
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: third_line_setting
    outcome: required
- rule_id: 4.2.30.bucket_b.C006424
  sut_section: 4.2.30
  drug_names:
  - cerrahi
  gate_b_sources:
  - C006424
  report_required: true
  message_tr: (1) Riosiguat; yalnızca inoperabl veya cerrahi tedavi sonrasında dirençli/nükseden KTEPH'li erişkin hastalardan;
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: prior_therapy
    outcome: resistant
- rule_id: 4.2.30.bucket_b.C006428
  sut_section: 4.2.30
  drug_names:
  - cerrahi
  - sama
  gate_b_sources:
  - C006428
  report_required: true
  message_tr: (2) Üçüncü basamak sağlık tesislerinde bu durumların belirtildiği ve en az birinin göğüs cerrahisi veya kalp
    damar cerrahisi uzman hekimi olması koşuluyla, kardiyoloji, göğüs hastalıkları, göğüs cerrahisi veya kalp damar cerrahisi
    uzman hekimlerinden en az üçünün bulunduğu üç ay süreli sağlık kurulu raporuna dayanılarak yine bu hekimlerce reçete edilir.
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: third_line_setting
    outcome: required
- rule_id: 4.2.43.bucket_b.C006806
  sut_section: 4.2.43
  drug_names:
  - sama
  gate_b_sources:
  - C006806
  report_required: true
  message_tr: b) Bu hususların belirtildiği, üçüncü basamak sağlık kurumlarında en az bir romatoloji uzman hekiminin bulunduğu
    6 ay süreli sağlık kurulu raporuna dayanılarak yine bu sağlık kurumlarında romatoloji uzman hekimlerince reçetelenir.
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: third_line_setting
    outcome: required
- rule_id: 4.2.47.bucket_b.C006896
  sut_section: 4.2.47
  drug_names:
  - sama
  gate_b_sources:
  - C006896
  report_required: true
  message_tr: kriterlerinden en az birinin sağlandığı vakalarda; üçüncü basamak resmi sağlık hizmeti sunucularında, çocuk
    endokrinoloji ve/veya çocuk metabolizma ve/veya çocuk endokrinoloji ve metabolizma ve/veya erişkin endokrinoloji ve metabolizma
    uzmanlarınca düzenlenecek 6 ay süreli sağlık kurulu raporu ile yine üçüncü basamak resmi sağlık hizmeti sunucularında
    bu uzmanlık dallarınca reçetelenerek tedaviye başlanır.
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: third_line_setting
    outcome: required
- rule_id: 4.2.47.bucket_b.C006898
  sut_section: 4.2.47
  drug_names:
  - sama
  gate_b_sources:
  - C006898
  report_required: true
  message_tr: Erken başlangıçlı (1 yaştan önce) morbid obezitesi olan (2 yaşın altında boya göre vücut ağırlığı > %140, 2
    yaş ve üzerinde Vücut Kitle İndeksi Standart Deviasyon Skoru > 3SDS olan) Leptin düzeyinin biyokimyasal olarak <2 ng/ml
    olduğu veya moleküler genetik tetkik ile Leptin geninde homozigot mutasyonun gösterildiği vakalarda; üçüncü basamak resmi
    sağlık hizmeti sunucularında çocuk endokrinoloji ve/veya çocuk metabolizma ve/veya çocuk endokrinoloji ve metabolizma
    ve/veya eriş
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: third_line_setting
    outcome: required
