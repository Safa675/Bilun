  drug_names:
  - hepatit c tedavisi
  - antiviral
  gate_b_sources:
  - C004984
  report_required: true
  message_tr: Genotip 1 nonsirotik ya da kompanse sirozu olan daha önceden proteaz inhibitörü kullanmış fakat NS5A
    inhibitörü almamış hastalarda 12 hafta;
  encode_bucket: B
  required_biomarkers:
  - marker: HCV_GENOTYPE
    status_any:
    - '1'
    - '2'
    - '3'
