- rule_id: 4.2.69.bucket_b.C007169
  sut_section: 4.2.69
  drug_names:
  - sama
  gate_b_sources:
  - C007169
  report_required: true
  message_tr: a) Pediatrik hastaların tedavisi için; üçüncü basamak resmi sağlık hizmeti sunucularında düzenlenen ve yukarıda
    yer alan tanı kriterlerinin belirtildiği, en az bir çocuk gastroentroloji uzman hekiminin yer aldığı üç çocuk sağlığı
