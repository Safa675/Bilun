  report_required: true
  message_tr: (2) Siklofosfamide dirençli veya siklofosfamid tedavisi verilemeyen ciddi, aktif granulamatoz polianjitis
    (GPA/ Wegener granülomatozu) ve mikroskobik polianjitis (MPA) hastalarının tedavisinde glukokortikoidlerle kombine
    olarak;
  encode_bucket: B
  requires_prior_therapy:
    drug_or_class: prior_therapy
    outcome: resistant
