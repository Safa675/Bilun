  report_required: true
  message_tr: (1) Hidroksiüre + asetil salisilik asit tedavisine dirençli olduğu ya da hidroksiüre ile dirençli
    sitopeni (anemi ve/veya lökopeni) geliştiği belgelenen, yüksek vasküler risk taşıyan esansiyel trombositemi
    hastalıklarında, hematoloji veya tıbbi onkoloji uzman hekimlerinden biri tarafından düzenlenen uzman hekim raporuna
    dayanılarak bu uzman hekimler tarafından reçete edilebilir.
  encode_bucket: B
  requires_prior_therapy:
