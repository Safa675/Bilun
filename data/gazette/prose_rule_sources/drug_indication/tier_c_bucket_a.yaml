  message_tr: (1) Kök hücre vericisi kardeş doğmasına yönelik IVF tedavisinde kullanılacak ilaçlar; SUT’un 2.4.4.İ.2 maddesi
    koşullarına uyan ve söz konusu maddede belirtilen sağlık kurulu raporuna istinaden IVF tedavisinin yapıldığı üremeye yardımcı
    tedavi merkezinde kadın hastalıkları ve doğum uzman hekimlerince reçeteye yazılabilecektir. Her bir IVF denemesine ilişkin
