  report_required: false
  message_tr: a) Biri maksimum doz indometazin olmak üzere en az 3 farklı nonsteroid antiinflamatuar ilacın maksimum dozunda
    kullanılmasına rağmen yeterli cevap alınamayan (Bath Ankilozan Spondilit Hastalık Aktivite İndeksi (BASDAİ) >5) ve bununla
    birlikte;
  encode_bucket: A
- rule_id: 4.2.4.bucket_a.c003926
  sut_section: 4.2.4
  drug_names:
  - myeloablatif dozda coklu ajanlı kemoterapi uygulanan
  gate_b_sources:
  - 4.2.4.(1)
  report_required: true
  message_tr: (1) Myeloablatif dozda çoklu ajanlı kemoterapi uygulanan, tümör yükü olan hematolojik maligniteli veya akut
    lösemi tanısı almış ve beyaz küre sayısı 100.000/mm3’den fazla olan, allopurinol ve hidrasyon tedavisine rağmen böbrek
    fonksiyonları bozulmuş (kreatin > 2 mg/dl, kreatin klerensi < 50 ml/dakika) veya allopurinolün kontrendike olduğu hastalarda;
    prospektüs şartlarına (en fazla 5 günlük tedavi) göre yatan hastalarda kullanılır. Hematoloji, tıbbi onkoloji veya nefroloji
    uz
  encode_bucket: A
  prescriber_specialties:
  - tıbbi onkoloji
  - hematoloji
  report_specialties:
  - tıbbi onkoloji
  - hematoloji
