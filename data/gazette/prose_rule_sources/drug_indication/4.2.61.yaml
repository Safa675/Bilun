    enforcement: Sağlık Bakanlığından hasta bazında alınacak endikasyon dışı onaya dayanılarak üçüncü basamakta çocuk hematoloji
      ve onkoloji veya erişkin hematoloji uzmanının yer aldığı 6 aylık sağlık kurulu raporuyla adı geçen hekimlerce reçete
      edilirse ödenir; primer MSK lenfoması ve MSK tutulumu olan lenfomalar hariç Hodgkin/Non-Hodgkin lenfomada kemik iliği
