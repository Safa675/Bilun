      raporda belirtilir
    message_tr: Sağlık Bakanlığından hasta bazında alınacak endikasyon dışı onaya dayanılarak, üçüncü basamak resmi sağlık
      hizmet sunucularında çocuk hematoloji ve onkoloji uzman hekiminin veya erişkin hematoloji uzman hekiminin yer aldığı
      6 aylık sağlık kurulu raporuna istinaden adı geçen hekimlerce reçete edilmesi halinde bedelleri Kurumca karşılanır.
      Sağlık Bakanlığından hasta bazında alınacak endikasyon dışı onaya dayanılarak, primer merkezi sinir sistemi lenfoması
      ve merkezi sinir sistemi tutulumu olan lenfomalar hariç olmak üzere Hodgkin Lenfoma ve Non-Hodgkin Lenfoma hastalarındaki
      kemik iliği nakli hazırlık rejimi kullanımında ise; söz konusu raporda karmustin kullanımının kontrendike olduğu durumların
      belirtilmesi halinde bedelleri Kurumca karşılanır. Endikasyon dışı onay tarihi ve süresi sağlık kurulu raporunda belirtilir
      (§4.2.61).
