      göğüs hastalıkları/romatoloji/iç hastalıkları uzmanlarınca reçete; raporda DLCO, FVC ve HRCT tarihleri belirtilmeli
    message_tr: Bu durumların belirtildiği üçüncü basamak sağlık kurumlarında en az bir romatoloji uzman hekimi ve en az bir
      göğüs hastalıkları uzman hekiminin yer aldığı 1 yıl süreli sağlık kurulu raporuna dayanılarak göğüs hastalıkları, romatoloji
      veya iç hastalıkları uzman hekimlerince reçetelenir. Sağlık kurulu raporunda DLCO, FVC değerlerinin tarihi ile HRCT
      görüntüleme raporunun tarihi belirtilmesi gerekmektedir (§4.2.46.C).
