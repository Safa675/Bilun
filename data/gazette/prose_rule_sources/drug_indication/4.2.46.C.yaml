  drug_names:
  - nintedanib
  icd10_codes:
  - M34
  - J84.1
  - J84.9
  report_required: true
  condition:
    coverage_note: true
  action:
    enforcement: sistemik skleroza bağlı interstisyel akciğer hastalarında DLCO≥%30, FVC≥%50 ve HRCT ile >%10 fibrozis varsa
      nintedanib başlanırsa ödenir
    message_tr: Karbonmonoksit difüzyon kapasitesi (DLCO) ≥%30, Forced Vital Kapasitesi (FVC) ≥%50 ve toraks yüksek çözünürlüklü
      bilgisayarlı tomografi (HRCT) ile %10'dan fazla fibrozis alanı varlığı gösteren sistemik skleroza bağlı interstisyel
      akciğer hastalarında nintedanib ile tedaviye başlanması halinde bedeli Kurumca karşılanır (§4.2.46.C).
