  action:
    enforcement: 'rosuvastatin ≥20 mg, atorvastatin/simvastatin/pravastatin ≥40 mg, fluvastatin ≥80 mg (kombinasyonları dahil):
      bu uzmanlarca düzenlenen raporla tüm hekimlerce; ilk rapor (24 ay) sonrası devam raporları aile hekimliğince de düzenlenebilir'
    message_tr: Rosuvastatinin 20 mg ve üzeri, atorvastatin/simvastatin/pravastatinin 40 mg ve üzeri, fluvastatinin 80 mg
      ve üzeri dozları (kombinasyonları dahil) kardiyoloji, kalp damar cerrahisi, endokrinoloji, geriatri, nöroloji veya iç
      hastalıkları uzmanlarınca düzenlenen rapora dayanılarak tüm hekimlerce reçete edilir; ilk rapor süresi (24 ay) sonunda
      devam raporlarının aile hekimliği uzmanlarınca da düzenlenmesi halinde bedelleri Kurumca karşılanır (§4.2.28.A-1).
- rule_id: 4.2.28.A_1.initial_report_two_lipid_panels
