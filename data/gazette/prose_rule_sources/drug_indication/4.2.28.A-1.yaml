  - kalp damar cerrahisi
  - endokrinoloji
  - iç hastalıkları
  - nöroloji
  - geriatri
  action:
    enforcement: ilk raporda son 6 ay içinde ≥1 hafta arayla iki kan lipid ölçümünün de yüksek olduğunu gösteren tetkik; rapor
      süresince tetkik değerlendirilmez, yenilemede lipid istenmez; ≥6 ay ara verilirse başlangıç kriterleri aranır
    message_tr: Tedaviye başlamaya esas ilk uzman raporunda, rapor öncesi son 6 ay içinde (a/b/c bentleri için) en az bir
      hafta ara ile iki kez yapılmış kan lipid ölçümlerinin her ikisinin de yüksek olduğunu gösteren tetkik belirtilir; rapor
      süresince tetkikler değerlendirilmez, yenilemede lipid sonucu istenmez, ≥6 ay ara verilirse başlangıç kriterleri yeniden
      aranır (§4.2.28.A-1).
