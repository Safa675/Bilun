  drug_names:
  - atipik antipsikotik parenteral
  icd10_codes:
  - F20
  - F29
  report_required: false
  action:
    enforcement: acil servislerde, uzun salınımlı/depo etkili formlar hariç, atipik antipsikotik parenteraller tek doz tüm
      hekimlerce
    message_tr: Acil hallerde, acil servislerde, yeni nesil (atipik) antipsikotiklerin parenteral formları (uzun salınımlı/depo
      etkili formları hariç) klinik şartlarda tek doz olarak tüm hekimler tarafından reçete edilebilir (§4.2.2).
- rule_id: 4.2.2.typical_antipsychotics_all_physicians
