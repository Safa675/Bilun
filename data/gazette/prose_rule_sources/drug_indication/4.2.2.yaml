  - lamotrijin
  - lamotrigine
  icd10_codes:
  - F31
  report_required: true
  report_specialties:
  - psikiyatri
  condition:
    coverage_note: true
  action:
    enforcement: lamotrijin bipolar bozukluk endikasyonunda psikiyatri uzmanı veya raporuyla tüm hekimlerce
    message_tr: Lamotrijin bipolar bozukluk endikasyonunda psikiyatri uzmanları tarafından veya bu hekimlerce düzenlenen uzman
      raporuna dayanılarak tüm hekimlerce reçete edilebilir (§4.2.2).
- rule_id: 4.2.2.parenteral_atypical_antipsychotics
  sut_section: 4.2.2
  gate_b_sources:
  - C003902
  drug_names:
  - atipik antipsikotik parenteral
  - risperidon depo
  - aripiprazol depo
  - paliperidon depo
  icd10_codes:
  - F20
  - F29
  report_required: true
  report_specialties:
  - psikiyatri
  action:
    enforcement: yeni nesil (atipik) antipsikotik parenteraller psikiyatri uzmanı veya raporuyla tüm hekimlerce; risperidon/aripiprazol/paliperidon
      parenteral formları EK-4/F hükümlerine göre
    message_tr: Yeni nesil (atipik) antipsikotiklerin parenteral formları psikiyatri uzmanı veya bu uzmanın düzenlediği rapora
      dayanılarak tüm hekimlerce reçete edilebilir; bu gruptan risperidon, aripiprazol ve paliperidonun parenteral formları
      EK-4/F hükümlerine göre reçete edilebilir (§4.2.2).
- rule_id: 4.2.2.parenteral_atypical_emergency_single_dose
  sut_section: 4.2.2
  gate_b_sources:
