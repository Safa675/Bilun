      olunca raporsuz 4 haftalık doz
    message_tr: Koroner artere stent uygulanacak hastalarda kardiyoloji veya kalp damar cerrahisi uzman hekimleri tarafından
      rapor aranmaksızın 24 saat öncesinden başlanabilir; stent takılan hastada taburcu olmasından itibaren rapor aranmaksızın
      4 haftalık doz bu hekimler tarafından reçete edilebilir (§4.2.15.A).
- rule_id: 4.2.15.A.high_risk_vascular_12mo_report
  sut_section: 4.2.15.A
