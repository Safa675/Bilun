  - nöroloji
  - kalp damar cerrahisi
  - acil tıp
  action:
    enforcement: 'kalp kapak biyoprotezi / anjiyografik KAH / tıkayıcı periferik arter hast. / serebral iskemik olay: ilgili
      uzmandan ≤12 ay süreli raporla tüm hekimlerce; ilk iki rapor (24 ay) sonrası aile hekimliği de rapor düzenleyebilir'
    message_tr: Kalp kapak biyoprotezi bulunan, anjiografik olarak belgelenmiş koroner arter hastalığı, tıkayıcı periferik
      arter hastalığı veya serebral iskemik olay (iskemik inme) saptananlarda kardiyoloji/iç hastalıkları/nöroloji/kalp damar
      cerrahisi/acil tıp uzmanlarından birinin ≤12 ay süreli raporuyla tüm hekimlerce reçete edilebilir; ilk iki rapor süresi
      (toplam 24 ay) sonunda sonraki raporlar en fazla 12 ay sürelerle aile hekimliği uzmanlarınca da düzenlenebilir (§4.2.15.A).
