  - kalp damar cerrahisi
  - iç hastalıkları
  - acil tıp
  action:
    enforcement: 'akut koroner sendrom (ST yükselmeli/ST yükselmesiz MI, anstabil anjina): yatan/müşahede hastada kardiyoloji/KDC/iç
      hastalıkları/acil tıp uzmanınca raporsuz reçete; taburcu sonra ≤4 hafta raporsuz veya ≤12 ay süreli uzman raporuyla
      tüm hekimlerce'
    message_tr: Akut koroner sendrom tanısıyla yatırılan/müşahedeye alınan, EKG/troponin pozitif NSTEMI veya anstabil anjina
      ve STEMI hastalarında kardiyoloji, kalp damar cerrahisi, iç hastalıkları veya acil tıp uzmanlarınca rapor aranmaksızın
      reçete edilebilir; taburcu sonra 4 haftayı geçmemek üzere raporsuz veya bu uzmanların ≤12 ay süreli raporuyla tüm hekimlerce
      reçete edilebilir (§4.2.15.A).
