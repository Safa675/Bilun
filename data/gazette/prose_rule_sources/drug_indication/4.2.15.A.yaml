      ilgili uzmanlarca raporsuz 24 saat önceden başlanır, stent takılan taburcu olunca raporsuz 4 haftalık doz'
    message_tr: Girişimsel periferik/serebral işlemler sonucu intrakraniyal dahil tüm intravasküler stent/stentgraft/kaplı
      stent veya cihaz (koil, trispan, onyx vb.) yerleştirilenlerde kardiyoloji/iç hastalıkları/nöroloji/kalp damar cerrahisi/beyin
      cerrahi veya girişimsel radyoloji yapan radyoloji uzmanınca rapor aranmaksızın 24 saat önceden başlanır; stent takılan
      hastanın taburcu olmasından itibaren rapor aranmaksızın 4 haftalık doz bu hekimlerce reçete edilir (§4.2.15.A).
