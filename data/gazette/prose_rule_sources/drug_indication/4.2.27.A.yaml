section_id: 4.2.27.A
rules:
- rule_id: 4.2.27.A.acquired_coagulopathy_bleed_report_free
  sut_section: 4.2.27.A
  icd10_ranges:
  - D65
  - D68
  gate_b_sources:
  - 4.2.27.A.a#64f0fd2c
  - 4.2.27.A.(2)#23e717e6
  drug_names:
  - prothrombin complex
  - pcc
  - fresh frozen plasma
  - ffp
  - vitamin k
  - k vitamini
  report_required: true
  report_specialties:
  - hematoloji
  - iç hastalıkları
  - çocuk sağlığı ve hastalıkları
  condition:
    coverage_note: true
  action:
    enforcement: 'kazanılmış koagülasyon bozukluğu (K vitamini yetersizliği, karaciğer yetmezliği) kanaması: kanama yeri belirtilerek
      acilde tüm uzmanlarca raporsuz en fazla 1 günlük doz; >1 gün ≤3 gün hematoloji (yoksa dahiliye/çocuk sağlık dahil) raporu;
      devamında hematoloji olan hastaneye sevk'
    message_tr: Kazanılmış (edinsel) koagülasyon bozukluklarında (K vitamini yetersizliği, karaciğer yetmezliği gibi) oluşan
      kanamalarda kanama yeri belirtilmek koşuluyla uzmanlarca yatan/acil müracaatta rapor aranmaksızın en fazla bir günlük
      dozda reçete edilirse bedeli Kurumca karşılanır; bir günden uzun tedavide ≤3 gün süreli hematoloji (yoksa dahiliye/çocuk
      sağlığı dahil) raporuyla ödenir, tedavinin devamı durumunda hematoloji uzmanı bulunan hastaneye sevk edilir (§4.2.27.A).
- rule_id: 4.2.27.A.coumarin_noac_bleed_report_free
  sut_section: 4.2.27.A
  icd10_ranges:
  - D65
  - D68
  gate_b_sources:
  - 4.2.27.A.(1)#2ce22711
  - 4.2.27.A.a#3d54d6c8
  drug_names:
  - prothrombin complex
  - pcc
  - fresh frozen plasma
  - ffp
  - beriplex
  - kanama durdurucu
  report_required: true
  report_specialties:
  - hematoloji
  - iç hastalıkları
  - çocuk sağlığı ve hastalıkları
  condition:
    coverage_note: true
  action:
    enforcement: 'kumarin/NOAK kaynaklı hayatı tehdit eden aktif kanama: INR/PT aranmadan kanama yeri belirtilerek yatan/ayaktan
      acilde tüm uzmanlarca raporsuz en fazla 1 günlük doz; >1 gün ise kanamanın devam ettiğini gösteren günlük dozlu ≤3 gün
      süreli hematoloji (yoksa dahiliye/çocuk sağlık dahil sağlık kurulu) raporu'
    message_tr: Kumarin türevleri ve NOAK kaynaklı hayatı tehdit eden aktif kanaması olanlarda INR/PT aranmadan kanama yeri
      belirtilerek yatan hastalarda acil durumlarda veya ayaktan acil müracaatta tüm uzmanlarca rapor şartı aranmaksızın en
      fazla bir günlük dozda reçete edilirse bedeli Kurumca karşılanır; bir günden uzun tedavide kanamanın devam ettiğini
      bildiren günlük dozlu en fazla üç gün süreli hematoloji uzmanı (yoksa dahiliye/çocuk sağlığı uzmanı içeren sağlık kurulu)
      raporuyla ödenir (§4.2.27.A).
- rule_id: 4.2.27.A.emicizumab_dosing_schedule
  sut_section: 4.2.27.A
  gate_b_sources:
  - 4.2.27.A.(3)#2f50d024
  drug_names:
  - emicizumab
  - hemlibra
  icd10_codes:
  - D66
  report_required: true
  report_specialties:
  - hematoloji
  condition:
    coverage_note: true
  action:
    enforcement: her reçetede güncel vücut ağırlığı; ilk 4 hafta haftada 1x3 mg/kg yükleme, 5. haftadan idame olarak haftada
      1x1,5 mg/kg veya 2 haftada 1x3 mg/kg veya 4 haftada 1x6 mg/kg
    message_tr: Her düzenlenen reçetede hastanın güncel vücut ağırlığı belirtilmelidir; emicizumab ilk 4 hafta haftada 1 kez
      3 mg/kg yükleme dozuyla başlanır, 5. haftadan itibaren haftada 1 kez 1,5 mg/kg, 2 haftada 1 kez 3 mg/kg veya 4 haftada
      1 kez 6 mg/kg idame dozlarında reçete edilirse bedeli Kurumca karşılanır (§4.2.27.A).
- rule_id: 4.2.27.A.emicizumab_inhibitor_prophylaxis
  sut_section: 4.2.27.A
  gate_b_sources:
  - 4.2.27.A.b#5872e852
  drug_names:
  - emicizumab
  - hemlibra
  icd10_codes:
  - D66
  - D68.31
  report_required: true
  report_specialties:
  - hematoloji
  condition:
    coverage_note: true
  action:
    enforcement: faktör VIII'e karşı >5 BU inhibitör gelişmiş tüm yaş gruplarında konjenital hemofili A rutin profilaksi
    message_tr: Faktör VIII'e karşı 5 Bethesda Ünitesi (BU) üzerinde inhibitör gelişmiş tüm yaş gruplarındaki konjenital hemofili
      A hastalarının rutin profilaksi tedavisinde kullanılması halinde bedeli Kurumca karşılanır (§4.2.27.A).
- rule_id: 4.2.27.A.emicizumab_paediatric_prophylaxis
  sut_section: 4.2.27.A
  gate_b_sources:
  - 4.2.27.A.a#34f187a5
  drug_names:
  - emicizumab
  - hemlibra
  icd10_codes:
  - D66
  report_required: true
  report_specialties:
  - hematoloji
  condition:
    coverage_note: true
  action:
    enforcement: faktör düzeyi ≤%1 ve/veya ayda >3 kanaması olan konjenital faktör VIII eksiklikli 18 yaş altı hemofili A'da
      rutin profilaksi
    message_tr: Faktör düzeyi %1 veya altında ve/veya ayda üçten fazla kanaması olan konjenital faktör VIII eksikliği olan
      18 yaş altı hemofili A hastalarının rutin profilaksi tedavisinde kullanılması halinde bedeli Kurumca karşılanır (§4.2.27.A).
- rule_id: 4.2.27.A.itt_bypassing_agent_acute_only
  sut_section: 4.2.27.A
  gate_b_sources:
  - 4.2.27.A.(2)#6a5324c5
  drug_names:
  - bypass edici ajan
  - feiba
  - rtpa
  - rekombinan faktör viia
  icd10_codes:
  - D66
  - D67
  - D68
  report_required: true
  report_specialties:
  - hematoloji
  action:
    enforcement: İTT esnasında akut kanama/cerrahi gereksiniminde mevcut bypass edici ajanlarla tedavi + İTT sürdürülür; İTT
      alanlara başka durumlarda bypass edici ajan kullanılmaz; >10 gün ara verilirse İTT'ye devam edilmez (§4.2.27 kapsamına
      geçilir)
    message_tr: İTT tedavisi esnasında akut kanaması ve/veya cerrahi girişim gerekli olan hastalarda mevcut bypass edici ajanlar
      ile kanama tedavisi uygulanabilir ve aynı zamanda İTT tedavisi sürdürülür; İTT alan hastalara bu tedaviler dışında bypass
      edici ajanlar kullanılmaz, tedaviye 10 günden fazla ara verilirse İTT'ye devam edilmez (§4.2.27.A).
