      aranmaz; yatan dışında 6 ay süreli sağlık kurulu raporuyla tüm hekimlerce
    message_tr: Yatan hastalar, kanser hastaları veya tüp ile beslenen hastalarda (orogastrik/nazogastrik/nazoenterik sonda
      veya gastrostomi/jejunostomi/gastrojejunostomi) yukarıdaki malnütrisyon koşulları aranmaz; yatan hastalar dışında bu
      durumların belirtildiği 6 ay süreli sağlık kurulu raporuyla tüm hekimlerce reçete edilirse bedeli Kurumca ödenir (§4.2.8.A).
