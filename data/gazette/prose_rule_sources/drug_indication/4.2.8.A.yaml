section_id: 4.2.8.A
rules:
- rule_id: 4.2.8.A.adult_dysphagia_special_enteral_2boxes
  sut_section: 4.2.8.A
  gate_b_sources:
  - 4.2.8.A.b#244d5695
  drug_names:
  - özel tıbbi amaçlı beslenme ürünü
  - enteral beslenme ürünü
  report_required: true
  report_specialties:
  - nöroloji
  - kulak burun boğaz
  - genel cerrahi
  - beyin cerrahi
  - anestezi ve yoğun bakım
  - geriatri
  - tıbbi onkoloji
  - radyasyon onkolojisi
  condition:
    coverage_note: true
  action:
    enforcement: inme, kronik nörolojik bozukluk, baş-boyun kanseri/cerrahi rezeksiyon sonucu yutma güçlüğü çeken yetişkinlerde;
      bu uzmanlardan en az birinin bulunduğu sağlık kurulu raporuyla tüm uzman hekimlerce; raporda ürün adı/günlük miktar,
      aylık en fazla iki kutu
    message_tr: İnme, kronik nörolojik bozukluklar ve baş boyun kanserleri ve cerrahi rezeksiyonda görülen yutma güçlüğü çeken
      yetişkin hastalarda; bu durumun belirtildiği nöroloji, kulak burun boğaz, genel cerrahi, beyin cerrahi, anestezi ve
      yoğun bakım, geriatri, tıbbi onkoloji, radyasyon onkolojisi uzmanlarından en az birinin bulunduğu sağlık kurulu raporuna
      istinaden tüm uzman hekimlerce reçete edilebilir; raporda ürünün adı ve günlük kullanım miktarı belirtilerek aylık en
      fazla iki kutu yazılır (§4.2.8.A).
- rule_id: 4.2.8.A.adult_malnutrition_1200kcal_3mo_report
  sut_section: 4.2.8.A
  gate_b_sources:
  - C004104
  drug_names:
  - enteral beslenme ürünü
  icd10_codes:
  - E40
  - E41
  - E42
  - E43
  - E44
  - E46
  report_required: true
  report_duration_months: 3
  condition:
    coverage_note: true
  action:
    enforcement: diyetetik tedavi/obezite cerrahisi kilo kayıpları malnütrisyon sayılmaz; bu durumların belirtildiği 3 ay
      süreli sağlık kurulu raporuyla tüm hekimlerce günlük en fazla 1200 kcal dozda reçete edilirse ödenir
    message_tr: Diyetetik tedaviler ve/veya obezite cerrahisi sonucu oluşan kilo kayıpları malnütrisyon olarak değerlendirilmez;
      tanımlanan malnütrisyon durumlarının belirtildiği 3 ay süreli sağlık kurulu raporuna dayanılarak tüm hekimlerce günlük
      en fazla 1200 kcal dozda reçete edilirse bedeli Kurumca ödenir (§4.2.8.A).
