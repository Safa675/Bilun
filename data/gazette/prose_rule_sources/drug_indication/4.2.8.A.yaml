    message_tr: Dallı zincirli aminoasitlerden zengin enteral beslenme ürünleri; karaciğer yetmezliği olan orta ve ağır (evre
      2 ve üzeri) ensefalopati gelişmiş hastalarda kullanılabilir, malnütrisyon kriterleri aranmaz; gastroenteroloji veya
      iç hastalıkları uzman hekim raporuna dayanılarak tüm hekimlerce reçete edilebilir (§4.2.8.A).
