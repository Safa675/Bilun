- rule_id: 4.2.8.A.paediatric_malnutrition_enteral_6mo_report
  sut_section: 4.2.8.A
  gate_b_sources:
  - C004096
  drug_names:
  - enteral beslenme ürünü
  - çocuk enteral beslenme
  icd10_codes:
  - E40
  - E41
  - E42
  - E43
  - E44
