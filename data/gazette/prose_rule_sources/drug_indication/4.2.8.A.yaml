  report_required: true
  report_duration_months: 6
  report_specialties:
  - çocuk hastalıkları
  - çocuk cerrahi
  - çocuk gastroenteroloji
  - çocuk nöroloji
  - çocuk metabolizma
  - çocuk endokrinoloji
  - çocuk endokrinoloji ve metabolizma
  condition:
    coverage_note: true
  action:
    enforcement: malnütrisyon gelişmiş çocukta çocuk hastalıkları/çocuk cerrahi uzmanlarınca en fazla 6 ay süreli raporla
      başlanır; süre sonunda koşullar devam ederse çocuk gastroenteroloji/nöroloji/metabolizma/cerrahi/endokrinoloji uzmanınca
      en fazla 6 ay süreli raporla tüm hekimlerce
    message_tr: Malnütrisyon gelişmiş çocuklarda bu durumların belirtildiği çocuk hastalıkları ve çocuk cerrahi uzmanlarınca
      düzenlenen en fazla 6 ay süreli raporla başlanır; bu sürenin sonunda malnütrisyon koşulları devam ederse çocuk gastroenteroloji,
      çocuk nöroloji, çocuk metabolizma, çocuk cerrahisi, çocuk endokrinoloji veya çocuk endokrinoloji ve metabolizma uzmanlarınca
      düzenlenen en fazla 6 ay süreli raporla tüm hekimlerce reçete edilirse bedeli Kurumca ödenir (§4.2.8.A).
