section_id: 4.2.33
rules:
- rule_id: 4.2.33.dexamethasone_ivt_implant_frequency
  sut_section: 4.2.33
  gate_b_sources:
  - 4.2.33.(10)
  drug_names:
  - dek sametazon intravitreal implant
  - ozurdex
  icd10_codes:
  - H35.3
  - H35.0
  - H34.8
  report_required: true
  report_specialties:
  - göz hastalıkları
  condition:
    coverage_note: true
  action:
    enforcement: anti-VEGF sonrası en erken 1 ay sonra; yılda en fazla 4 defa; ardışık uygulamada ≥3 ay aralık; bevacizumab
      yükleme sonrası 3. ayda hekim uygun görürse deksametazon devam veya beva/ranibi/aflibersept idameye geçiş
    message_tr: Deksametazon intravitreal implant; anti-VEGF sonrası en erken 1 ay sonra olmak kaydıyla yılda en fazla 4 defa,
      aynı göze ardışık uygulamada iki doz arasında ≥3 ay olmalıdır; bevacizumab yükleme dozu sonrası deksametazon yapılan
      hastanın 3. ay kontrolünde hekim uygun görürse aynı ilaçla devam veya yükleme dozu zorunluluğu olmaksızın beva/ranibi/aflibersept
      idameye geçilebilir (§4.2.33).
