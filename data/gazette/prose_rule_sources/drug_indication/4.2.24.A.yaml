  prescriber_specialties:
  - göğüs hastalıkları
  - alerji
  - immünoloji ve alerji hastalıkları
  condition:
    coverage_note: true
  action:
    enforcement: ilk tedaviye yanıt üçüncü basamakta 16. haftada değerlendirilir ve tedaviye devam uygun görülürse bu durum
      belirtilen alerji/immünoloji-alerji uzmanlı sağlık kurulu raporuyla göğüs/alerji uzmanlarınca reçete edilirse ödenir
    message_tr: İlk tedaviye yanıtın üçüncü basamak resmi sağlık hizmeti sunucularında 16 ncı haftada değerlendirilmesi ve
      tedaviye devamın uygun görülmesi halinde bu durumun belirtildiği en az bir alerji veya immünoloji ve alerji hastalıkları
      uzman hekiminin yer aldığı sağlık kurulu raporu ile göğüs hastalıkları, alerji veya immünoloji ve alerji hastalıkları
      uzman hekimleri tarafından reçete edilmesi halinde bedeli Kurumca karşılanır (§4.2.24.A).
