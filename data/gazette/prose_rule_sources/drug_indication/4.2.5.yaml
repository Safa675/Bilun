  - botox
  - dysport
  - onabotulinumtoksin
  - abobotulinumtoksin
  report_required: true
  report_specialties:
  - uzman hekimler
  action:
    enforcement: tedaviden yarar görüp tekrarı düşünülenlerde 6 aylık periyotlarda her defasında yeni sağlık kurulu raporuyla
      en fazla iki uygulama; tek seansta botox ≤300 ünite, dysport ≤1.000 ünite; bu endikasyonlar dışında ödenmez
    message_tr: Yukarıda a ve b bentlerinde sıralanan endikasyonlar için tedaviden yarar görüp tekrarı düşünülen hastalarda
      6 aylık periyotlarda her defasında yeni bir sağlık kurulu raporu düzenlenerek en fazla iki uygulama ve tek seansta botoks
      için toplam 300 üniteyi, dysport için 1.000 üniteyi aşmamak üzere yapılabilir (§4.2.5).
