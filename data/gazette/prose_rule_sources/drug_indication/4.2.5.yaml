rules:
- rule_id: 4.2.5.botox.axillary_hyperhidrosis_tertiary_coverage
  sut_section: 4.2.5
  gate_b_sources:
  - C003932
  - C003935
  drug_names:
  - botulinum toksini
  - botox
  - dysport
  - onabotulinumtoksin
  - abobotulinumtoksin
  icd10_codes:
  - L74.5
  - R61
  report_required: true
  report_duration_months: 12
  report_specialties:
  - endokrinoloji ve metabolizma
  - göğüs cerrahisi
  - dermatoloji
  prescriber_specialties:
  - endokrinoloji ve metabolizma
  - göğüs cerrahisi
  - dermatoloji
  condition:
    coverage_note: true
  action:
    enforcement: 'inatçı şiddetli aksiller primer hiperhidroz: 1 yıl topikal tedaviye dirençli erişkinlerde; altta yatan metabolik/endokrin
      bozukluk olmadığı belirtilmeli; 3. basamakta endokrinoloji+göğüs cerr.+dermatoloji birlikte ≤1 yıl rapor, ≤6 ayda bir;
      tedavi ≤2 yıl; botox ≤50 ünite/koltuk altı, dysport ≤100 ünite/koltuk altı'
    message_tr: Bir yıl süre ile topikal tedavi alan ve bu tedaviye dirençli olan, inatçı şiddetli aksiller primer hiperhidroz
      tedavisinde erişkin hastalarda botulinum toksini kullanımı için altta yatabilecek metabolik ve endokrin bir bozukluğu
      olmadığının belirtildiği, üçüncü basamak resmi sağlık hizmeti sunucularında endokrinoloji ve metabolizma, göğüs cerrahisi
      ve dermatoloji uzman hekimlerinin birlikte yer aldığı en fazla bir yıl süreli sağlık kurulu raporu ile en fazla 6 ayda
      bir uygulanması halinde bedelleri Kurumca karşılanır; tedavi süresi en fazla 2 yıldır, tek seansta her bir koltuk altı
      için botox 50 üniteyi, dysport ise 100 üniteyi aşmamak üzere yapılabilir (§4.2.5).
- rule_id: 4.2.5.botox.outside_indications_nopay
  sut_section: 4.2.5
  gate_b_sources:
