  drug_names:
  - botulinum toksini
  - botox
  - dysport
  - onabotulinumtoksin
  - abobotulinumtoksin
  pay: false
  action:
    enforcement: 'no-pay condition: tanımlı endikasyonlar (a/b bentleri) dışında botulinum toksini kullanımı'
    message_tr: Bu endikasyonlar dışında bedeli ödenmez (§4.2.5).
- rule_id: 4.2.5.botox.paediatric_cerebral_palsy_tertiary_coverage
  sut_section: 4.2.5
  gate_b_sources:
  - C003929
  - C003930
  - C003933
  drug_names:
  - botulinum toksini
  - botox
  - dysport
  - onabotulinumtoksin
  - abobotulinumtoksin
  icd10_codes:
  - G80
  report_required: true
  report_specialties:
  - ortopedi
  - fiziksel tıp ve rehabilitasyon
  - çocuk nörolojisi
  - çocuk sağlığı ve hastalıkları
  prescriber_specialties:
  - ortopedi
  - fiziksel tıp ve rehabilitasyon
  - çocuk nörolojisi
  - çocuk sağlığı ve hastalıkları
  condition:
    coverage_note: true
  action:
    enforcement: 'pediatrik serebral palsi: 3. basamak (üniversite/eğitim-araştırma) veya FTR dal hastanesinde ortopedi/PMR/çocuk
      nörolojisi/çocuk sağlığı uzmanının yer aldığı sağlık kurulu raporuyla bu uzmanlardan biri tarafından reçete; ≤18 yaş,
      sistemik hastalık/kemik deformitesi/kanama diyatezi/fikst kontraktür olmayanlarda en fazla iki adaleye'
    message_tr: Pediatrik serebral palsi endikasyonunda üçüncü basamak resmi sağlık hizmeti sunucularında ile fizik tedavi
      ve rehabilitasyon dal hastanelerinde; ortopedi, fiziksel tıp ve rehabilitasyon, çocuk nörolojisi veya çocuk sağlığı
      ve hastalıkları uzman hekimlerinin yer aldığı sağlık kurulu raporuna dayanılarak belirtilen uzman hekimlerden biri tarafından
      reçete edilmesi halinde bedeli ödenir; 18 yaşa kadar sistemik hastalığı, kemiksel deformite, kanama diyatezi, fikst
      kontraktür olmayan hastalarda en fazla iki adaleye uygulanır (§4.2.5).
- rule_id: 4.2.5.botox.repeat_application_6mo_report_permission
  sut_section: 4.2.5
