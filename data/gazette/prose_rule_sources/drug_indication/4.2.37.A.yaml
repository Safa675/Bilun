  report_required: true
  report_specialties:
  - endokrinoloji ve metabolizma
  prescriber_specialties:
  - endokrinoloji ve metabolizma
  action:
    enforcement: aktif akromegali (cerrahi/radyoterapi sonrası veya uygun olmayan), ≥12 ay tam doz uzun etkili somatostatin
      analoguna rağmen IGF-1 yüksek olanlarda pegvisomant; 3. basamak (üniversite/eğitim-araştırma) içinde en az bir endokrinoloji
      ve metabolizma uzmanı yer alan sağlık kurulu raporu
    message_tr: Cerrahi ve/veya radyasyon terapisine rağmen veya genel durumu operasyon ve/veya radyasyon terapisine uygun
      olmayan aktif akromegalisi olan ve en az 12 aylık süre ile ve tam dozda uzun etkili somatostatin analogları ile tedaviye
      rağmen IGF-1 düzeyleri yaşa göre belirlenen normal değerlerin üstünde kalan hastalarda kullanılabilir; bu hastalar için
      eğitim ve araştırma ile üniversite hastanelerinde üçüncü basamak resmi sağlık hizmeti sunucularında içinde en az bir
      endokrinoloji ve metabolizma uzmanının yer aldığı sağlık kurulu raporu düzenlenir (§4.2.37.A).
