rules:
- rule_id: 4.2.57.atopic_dermatitis_16wk_response_continue
  sut_section: 4.2.57
  gate_b_sources:
  - C007095
  drug_names:
  - abrositinib
  - barisitinib
  - upadasitinib
  - dupilumab
  icd10_codes:
  - L20
  report_required: true
  action:
    enforcement: 16 haftalık kullanım sonunda tedavi başlangıcına göre tanımlı kriterlerden en az biri sağlanırsa tedaviye
      devam edilebilir
    message_tr: 16 haftalık ilaç kullanım süresi sonunda tedavi başlangıcına göre belirlenen kriterlerden en az birinin sağlanması
      durumunda tedaviye devam edilebilir (§4.2.57).
- rule_id: 4.2.57.atopic_dermatitis_dupilumab_risk_factor
  sut_section: 4.2.57
  gate_b_sources:
  - 4.2.57.b
  drug_names:
  - dupilumab
  icd10_codes:
  - L20
  report_required: true
  condition:
    coverage_note: true
  action:
    enforcement: '>2 ay sistemik kortikosteroid/siklosporin yanıtsız/tolere edemeyen/kontrendike + risk faktörlerinden en
      az biri olan 18 yaş ve üzeri orta-şiddetli atopik dermatitte dupilumab başlanması koşullar raporda belirtilirse ödenir'
    message_tr: İki aydan uzun süreli sistemik kortikosteroid ve siklosporin kullanımından yarar görmeyen veya bu ilaçları
      tolere edemeyen veya bu ilaçların kontrendike olduğu ve belirtilen risk faktörlerinden en az birine sahip olan 18 yaş
      ve üzeri orta ve şiddetli atopik dermatitli hastalarda bu durumların sağlık kurulu raporunda belirtilmesi koşuluyla
      tedaviye Dupilumab ile başlanması halinde bedelleri Kurumca karşılanır (§4.2.57).
- rule_id: 4.2.57.atopic_dermatitis_jak_after_12wk
  sut_section: 4.2.57
  gate_b_sources:
  - 4.2.57.a
  drug_names:
  - abrositinib
  - barisitinib
  - upadasitinib
  icd10_codes:
  - L20
  report_required: true
  condition:
    coverage_note: true
  action:
    enforcement: abrositinib/baricitinib/upadacitinib'ten en az birini 12 hafta kullanıp yanıtsız/tolere edemeyen/kontrendike
      18 yaş ve üzeri orta-şiddetli atopik dermatit; koşullar sağlık kurulu raporunda belirtilirse ödenir
    message_tr: Abrositinib, baricitinib veya upadasitinib tedavilerinden en az birini 12 hafta süre ile kullanmış olmasına
      rağmen yanıt vermeyen veya bu tedavileri tolere edemeyen veya bu ilaçların kontrendike olduğu 18 yaş ve üzeri orta ve
      şiddetli atopik dermatitli hastalarda, bu durumların sağlık kurulu raporunda belirtilmesi koşuluyla tedaviye başlanması
      halinde bedelleri Kurumca karşılanır (§4.2.57).
