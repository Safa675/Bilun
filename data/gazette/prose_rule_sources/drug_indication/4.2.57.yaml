  action:
    enforcement: üçüncü basmakta üç deri ve zührevi hastalıkları uzmanının yer aldığı 4 ay süreli sağlık kurulu raporuyla
      deri uzmanlarınca reçete edilirse ödenir; upadasitinib/abrositinib/barisitinib ve dupilumab birlikte kullanılamaz
    message_tr: Üçüncü basamak resmi sağlık hizmet sunucularında üç deri ve zührevi hastalıkları uzman hekiminin yer aldığı
