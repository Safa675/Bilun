  drug_names:
  - seleksipag
  - selexipag
  - uptravi
  icd10_codes:
  - I27.0
  - I27.2
  report_required: true
  condition:
    coverage_note: true
  action:
    enforcement: seleksipag yalnız ERA ve/veya PDE-5 inhibitörü ile tedavinin yetersiz olduğu hastalarda kombinasyon (inhaler
      iloprost trometamol ile birlikte kullanım hariç)
    message_tr: Seleksipag yalnızca endotelin reseptör antagonisti (ERA) ve/veya fosfodiesteraz Tip 5 (PDE-5) inhibitörü ile
      tedavinin yetersiz olduğu hastalarda kombinasyon tedavisi şeklinde (inhaler iloprost trometamol ile birlikte kullanımı
      hariç) kullanılması halinde bedeli Kurumca karşılanır (§4.2.30.A).
