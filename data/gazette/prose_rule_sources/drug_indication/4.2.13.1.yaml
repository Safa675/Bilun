  action:
    enforcement: çocuk TDF/TAF/entekavir 1. yıl sonunda DNA pozitifse yaşa göre geçiş veya TDF+entekavir/TAF+entekavir
    message_tr: Çocuklarda TDF/TAF/entekavir ile tedavide 1. yıl sonunda HBV DNA pozitifse yaş grubu gözetilerek bu antiviraller
      arasında geçiş veya TDF+entekavir/TAF+entekavir birlikte kullanılabilir (§4.2.13.1).
- rule_id: 4.2.13.1.pegifn_adult_hbv_criteria
  sut_section: 4.2.13.1
  gate_b_sources:
  - C004551
  - 4.2.13.3.1.(1)
  - 4.2.13.3.2.(5)
  drug_names:
  - pegile interferon
  - peginterferon
  - pegasys
  - peg intron
  icd10_codes:
  - B18.0
  - B18.1
  report_required: true
  report_specialties:
  - gastroenteroloji
  - enfeksiyon hastalıkları
  action:
    enforcement: 'erişkin pegile interferon: ALT>2xÜS + (HBeAg neg ve DNA≤10^7) veya (HBeAg poz ve DNA≤10^9); kronik HBV''de
      en fazla 48 hafta'
    message_tr: Erişkinde pegile interferonlar; ALT değeri normalin üst sınırının 2 katını geçen, HBeAg negatif ve HBV DNA≤10^7
      olan veya HBeAg pozitif ve HBV DNA≤10^9 olan hastalarda kullanılabilir; kronik hepatit B'de en fazla 48 hafta (§4.2.13.1).
- rule_id: 4.2.13.1.pegifn_paediatric_24wk
  sut_section: 4.2.13.1
  gate_b_sources:
  - C004552
  drug_names:
