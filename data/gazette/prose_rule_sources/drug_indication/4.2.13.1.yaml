  icd10_codes:
  - B18.0
  - B18.1
  report_required: true
  report_specialties:
  - gastroenteroloji
  - enfeksiyon hastalıkları
  action:
    enforcement: lamivudin/telbivudin 24. hafta HBV DNA≥50 IU/ml ise diğer antivirale geçiş; <50 IU/ml ise geçiş/ekleme yok
    message_tr: Lamivudin veya telbivudin alanlarda 24. haftada HBV DNA≥50 IU/ml ise diğer antiviraller kullanılabilir; ancak
      24. haftada DNA<50 IU/ml ise başka oral antivirale geçilemez veya eklenemez (§4.2.13.1).
