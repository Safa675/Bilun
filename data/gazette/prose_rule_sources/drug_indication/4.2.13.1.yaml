  report_required: true
  report_specialties:
  - gastroenteroloji
  - enfeksiyon hastalıkları
  - çocuk sağlığı ve hastalıkları
  action:
    enforcement: çocukta pegile interferon 24 hafta; ilk 24 haftanın bitiminden ≥1 yıl sonra koşulları taşıyanlara en fazla
      24 haftalık ikinci kür
    message_tr: Çocuklarda pegile interferon tedavi süresi 24 haftadır; 24 haftalık tedavinin bitiminden en az 1 yıl sonra
      koşulları yeniden taşıyan hastalara en fazla 24 haftalık ikinci bir pegile interferon tedavisi verilebilir (§4.2.13.1).
