  action:
    enforcement: çocuk lamivudin 24. hafta DNA≥50 IU/ml → yaşa göre TDF/TAF/entekavir; <50 IU/ml ise geçiş/ekleme yok
    message_tr: Lamivudin alan çocuk hastalarda 24. haftada HBV DNA≥50 IU/ml ise yaş grubu gözetilerek TDF/TAF/entekavir kullanılabilir;
      <50 IU/ml ise başka oral antivirale geçilemez/eklenemez (§4.2.13.1).
- rule_id: 4.2.13.1.paediatric_tdf_taf_entecavir_year1_switch
  sut_section: 4.2.13.1
  gate_b_sources:
