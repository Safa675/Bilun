    enforcement: bu durumların belirtildiği, çocuk hematolojisi ve onkolojisi/çocuk hematolojisi/çocuk onkolojisi/çocuk kardiyolojisi
      veya neonatoloji uzmanlarından birinin ≤6 ay süreli raporuyla bu uzmanlarca reçete edilirse ödenir; tedavinin başlangıcından
