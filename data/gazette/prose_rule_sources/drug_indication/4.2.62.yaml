    message_tr: 5 hafta-5 ay yaş aralığında olan bebeklerde yutma güçlüğü, kanama/bası bulguları veya solunum güçlüğü vb.
      morbiditeyi önemli derecede olumsuz etkileyecek durumlara sebep olan ve sistemik tedavi gerektirerek hızla çoğalan çocukluk
      çağı hemanjiyomlarının tedavisinde aşağıda belirtilen özelliklerden en az birini taşıyan hastalarda kullanılması halinde
      bedelleri Kurumca karşılanır (§4.2.62).
