  - C61
  report_required: true
  report_specialties:
  - tıbbi onkoloji
  prescriber_specialties:
  - tüm uzman hekimler
  condition:
    coverage_note: true
  action:
    enforcement: hormon ablasyonu uygulanmış nonmetastatik prostat kanserli veya meme kanseri nedeniyle adjuvan aromataz inhibitörü
      alan yüksek kırk riskli hastalarda osteoporoz; en az bir tıbbi onkoloji uzmanı yer alan sağlık kurulu raporuyla tüm
      uzman hekimlerce reçete
    message_tr: Hormon ablasyonu uygulanmış olan nonmetastatik prostat kanserli veya meme kanseri nedeniyle adjuvan aromataz
      inhibitörü tedavisi gören yüksek kırık riskine sahip hastalardaki osteoporoz tedavisinde; bu durumun belirtildiği en
      az bir tıbbi onkoloji uzman hekiminin yer aldığı sağlık kurulu raporuna dayanılarak tüm uzman hekimlerce reçete edilmesi
      halinde bedelleri Kurumca karşılanır (§4.2.17.A).
- rule_id: 4.2.17.A.osteoporosis_2yr_report_combo_one_paid
