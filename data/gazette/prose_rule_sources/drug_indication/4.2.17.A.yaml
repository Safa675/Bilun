  drug_names:
  - bifosfonat
  - raloksifen
  - calcitonin
  - stronsiyum ranelat
  icd10_codes:
  - M80
  - M81
  report_required: true
  report_duration_months: 24
  condition:
    coverage_note: true
  action:
    enforcement: bifosfonatlar ve diğer osteoporoz ilaçları tanımlı koşullarda ödenir; tedavi süresinin belirtildiği 2 yıllık
      sağlık raporu gerekir; kombine kullanımda yalnızca birinin bedeli ödenir
    message_tr: Osteoporoz tedavisinde bifosfonatlar (kombinasyonları dahil) ve diğer osteoporoz ilaçları (raloksifen, calcitonin,
      stronsiyum ranelat) belirtilen koşullarda ödenir. Bu ilaçlar tedavi süresinin belirtildiği sağlık raporuna
      dayanılarak reçete edilir; rapor süresi 2 yıldır. Bu grup ilaçların kombine kullanımında sadece birinin bedeli ödenir
      (§4.2.17.A).
