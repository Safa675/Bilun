    enforcement: parikalsitol parenteral formları yalnızca hemodiyaliz hastalarına nefroloji/iç/çocuk veya diyaliz sertifikalı
      uzmanın ≤6 ay raporuyla bu hekimlerce en fazla 1 aylık dozda reçete
    message_tr: Parikalsitolün parenteral formlarının yalnızca hemodiyaliz hastalarına yukarıda belirtilen koşullarda nefroloji,
      iç hastalıkları veya çocuk sağlığı ve hastalıkları uzman hekimleri veya diyaliz sertifikalı uzman hekimi tarafından
      düzenlenen en fazla 6 ay süreli sağlık raporuna istinaden yine bu hekimler tarafından en fazla 1 aylık dozda reçete
      edilmesi halinde Kurumca bedelleri karşılanır (§4.2.9.C).
