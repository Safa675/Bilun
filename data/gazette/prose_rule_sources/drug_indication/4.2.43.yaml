    message_tr: Kalsiyum kanal blokerleri ve intravenöz iloprost ile en az 3 ay süreyle tedavi görmüş ve yanıt alınamamış
      ve en az biri 2 mm'den fazla çapı ve görünebilir derinliği olan ağrılı kardinal ülser olmak üzere multiple (≥4 adet)
      dijital ülseri olan hastalarda tedaviye başlanır; bosentan etkin maddesini 32 mg dozunda içeren ilaçlar ise bu durumları
      karşılayan ve yutma güçlüğü çeken (yoğun bakımda tedavi gören veya entübe veya ağızdan beslenemeyen veya nazogastrik
      beslenme zorunluluğu olan) erişkin hastalarda raporda belirtilmesi koşulu ile reçetelenmesi halinde bedeli Kurumca karşılanır
      (§4.2.43).
