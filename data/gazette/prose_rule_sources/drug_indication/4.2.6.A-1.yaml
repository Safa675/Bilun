- rule_id: 4.2.6.A1.neurosecretory_bioinactive_gh_somatropin
  sut_section: 4.2.6.A-1
  icd10_ranges:
  - E23.0
  - E23.1
  - E23.7
  - E34.3
  gate_b_sources:
  - C003977
  - C003982
  drug_names:
  - somatropin
  - büyüme hormonu
  report_required: true
  action:
    enforcement: boy sapması <-2 SD + yıllık uzama hızı yetersiz + kemik yaşı takvim yaşından >2 yıl geri (4 yaş altı/puberte
      hariç); 2 GH uyarı testine yanıt alınanlarda uyku GH profili; nörosekretuar disfonksiyon veya IGF-1 <-2 SD ise IGF-1
      jenerasyon testi ile biyoinaktif GH; yalnızca somatropin
    message_tr: Boy sapması patolojik olan <-2 SD ve yıllık uzama hızı yetersiz kalan, kemik yaşı takvim yaşına göre 2 yıldan
      daha fazla geri olan (4 yaş altı veya puberte dönemi hariç), yapılan 2 büyüme hormonu uyarı testine yeterli yanıt alınan
      hastalara uyku esnasında büyüme hormonu profili çıkartılmalı; nörosekretuar disfonksiyon veya serum IGF-1 <-2 SD olması
      koşuluyla yapılacak IGF-1 jenerasyon testi ile biyoinaktif büyüme hormonu saptanması halinde (yalnızca somatropin) kullanılabilir
      (§4.2.6.A-1).
