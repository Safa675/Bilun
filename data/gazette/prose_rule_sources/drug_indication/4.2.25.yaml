  condition:
    coverage_note: true
  action:
    enforcement: yeni nesil antiepileptikler nöroloji/beyin cerrahisi uzmanınca veya bu uzmanlardan birinin düzenlediği uzman
      raporuyla tüm hekimlerce reçete edilirse ödenir
    message_tr: Yeni nesil antiepileptiklerin (lamotrigin, topiramat, vigabatrin, levatirasetam) nöroloji veya beyin cerrahisi
      uzman hekimleri tarafından veya bu uzman hekimlerden biri tarafından düzenlenen uzman hekim raporuna dayanılarak tüm
      hekimlerce reçete edilmesi halinde bedelleri Kurumca karşılanır (§4.2.25).
