rules:
- rule_id: 4.2.25.gabapentin_1yr_report_combo_nopay
  sut_section: 4.2.25
  gate_b_sources:
  - C006204
  drug_names:
  - gabapentin
  - pregabalin
  icd10_codes:
  - G40
  report_required: true
  report_duration_months: 12
  report_specialties:
  - nöroloji
  prescriber_specialties:
  - nöroloji
  condition:
    coverage_note: true
  action:
    enforcement: gabapentin 2/3. basamakta en az bir nöroloji uzmanı içeren 1 yıllık sağlık kurulu raporuyla nöroloji uzmanlarınca
      reçete edilirse ödenir; pregabalin ve gabapentin kombine kullanılamaz
    message_tr: Gabapentin etken maddeli ilaçların ikinci veya üçüncü basamak sağlık hizmeti sunucularında düzenlenen en az
      bir nöroloji uzman hekiminin yer aldığı 1 yıl süreli sağlık kurulu raporuna istinaden nöroloji uzman hekimlerince reçete
      edilmesi halinde bedelleri Kurumca karşılanır. Pregabalin ve gabapentin kombine olarak kullanılamaz (§4.2.25).
- rule_id: 4.2.25.lacosamide_16yr_partial_2aed_6mo
  sut_section: 4.2.25
  gate_b_sources:
  - C006202
  drug_names:
  - lakozamid
  - lacosamide
  icd10_codes:
  - G40
  report_required: true
  report_specialties:
  - nöroloji
  condition:
    coverage_note: true
  action:
    enforcement: 16 yaş ve üzeri parsiyel başlangıçlı epilepside (ikincil jeneralize olan/olmayan) en az 2 antiepileptik tek/kombine
      6 ay kullanıp yanıtsız olana ek tedavi/monoterapi; nöroloji uzman raporuyla tüm uzmanlarca reçete
    message_tr: Lakozamid; 16 yaş ve üzerindeki parsiyel başlangıçlı epilepsi hastalarında ikincil jeneralize olan veya olmayan
      nöbetlerin tedavisinde, en az iki antiepileptik ilacın en az 6 ay süreyle tek başına veya kombine kullanımından sonra
      tedaviye yanıt alınamayan hastalarda ek tedavi veya monoterapi olarak, bu durumların belirtildiği nöroloji uzman hekim
      raporuna dayanılarak tüm uzman hekimlerce reçete edilebilir (§4.2.25).
- rule_id: 4.2.25.new_gen_antiepileptics_coverage
