  action:
    enforcement: iç hastalıkları/nefroloji/romatoloji/FTR uzmanlarından birinin laboratuvar sonuçlarını da içeren 1 yıllık
      uzman raporuyla tüm uzman hekimlerce reçete edilirse ödenir
    message_tr: İç hastalıkları, nefroloji, romatoloji veya fizik tedavi ve rehabilitasyon uzman hekimlerinden biri tarafından
      düzenlenen, laboratuvar sonuçlarının da yer aldığı 1 yıl süreli uzman hekim raporuna dayanılarak tüm uzman hekimler
      tarafından reçete edilmesi halinde bedeli Kurumca karşılanır (§4.2.52).
