- rule_id: 4.2.52.gout.febuxostat_hyperuricemia_allopurinol_failure_coverage
  sut_section: 4.2.52
  gate_b_sources:
  - 4.2.52.a#42554256
  drug_names:
  - febuxostat
  - febuxostat
  - urik asit düşürücü
  icd10_codes:
  - M10
  - E79.0
  report_required: true
  condition:
    coverage_note: true
  action:
    enforcement: kronik hiperürisemi (gut atağında ÜA>6 mg/dl, atak yoksa >8 mg/dl); allopurinol ile 3 ay tedaviye rağmen
      ÜA<6'ya düşmeyen veya allopurinol intolerans/kontrendikasyonu olanlarda başlanır; ÜA<3,5 olunca sonlanır; >6 ay ara
      verilirse başlangıç kriterleri yeniden aranır
    message_tr: Serum ürik asit düzeylerinin gut artriti atağı bulunması durumunda 6 mg/dl'nin üzerinde, gut artriti atağı
      bulunmaması durumunda ise 8 mg/dl'nin üzerinde olduğu kronik hiperürisemi hastalarında, allopurinol ile 3 ay süreli
      tedaviye rağmen serum ürik asit düzeyi 6 mg/dl'nin altına düşmeyen veya allopurinol intoleransı olan ve/veya kontrendikasyonu
      olan hastalarda tedaviye başlanması halinde bedelleri Kurumca karşılanır; serum ürik asit düzeyleri 3,5 mg/dl'nin altına
      düşen hastalarda tedavi sonlandırılır, 6 aydan uzun süre ara verildiğinde başlangıç kriterleri aranır (§4.2.52).
