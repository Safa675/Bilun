    enforcement: yoğun bakımda anestezi-reanimasyon/enfeksiyon/iç hastalıkları/göğüs/genel cerrahi hekimlerinden en az üçünün
      onayıyla, ≥2 organ yetmezliği gelişmiş ağır sepsiste ilk 48 saatte teşhis+günlük doz/süre (24 μg/kg/saat IV x 96 saat)
