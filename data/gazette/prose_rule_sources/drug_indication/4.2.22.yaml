    message_tr: Yoğun bakım ünitelerinde, anestezi ve reanimasyon, enfeksiyon hastalıkları, iç hastalıkları, göğüs hastalıkları,
      genel cerrahi hekimlerinden en az üçünün onayının bulunduğu, en az iki organ yetmezliği gelişmiş ağır sepsis hastalarının
      tedavisinde, ilk 48 saat içerisinde, hastalığın teşhisi, günlük kullanım dozu ve süresini (24 μg/kg/saat IV x 96 saat)
      belirten onaylı epikriz raporuna dayanılarak reçete edilmesi halinde bedeli ödenir; yeniden kullanım gerektiğinde belirtilen
      hekimlerden en az üçü tarafından sağlık kurulu raporu düzenlenir, raporda günlük doz/süre ve epikrise dayanılarak kullanıldığı
      belirtilmelidir (§4.2.22).
