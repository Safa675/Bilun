- rule_id: 4.2.24.B.resp.nebul_respiratory_drugs_coverage
  sut_section: 4.2.24.B
  gate_b_sources:
  - C006182
  drug_names:
  - nebül formu solunum sistemi ilaçları
  icd10_codes:
  - J44.0
  - J44.1
  - J44.9
  - J45
  report_required: true
  report_specialties:
  - göğüs hastalıkları
  - immünoloji
  - immünoloji ve alerji
  - alerji
  - çocuk sağlığı ve hastalıkları
  condition:
    coverage_note: true
  action:
    enforcement: nebül formları (arformoterol hariç) Bakanlık onaylı endikasyonda tüm hekimlerce raporsuz en fazla 1 kutu;
      devamı göğüs/immünoloji(-alerji)/alerji/çocuk uzman raporuyla diğer hekimlerce; aynı gruptan iki nebül kombine kullanılamaz
    message_tr: Nebül formundaki solunum sistemi ilaçları (arformoterol hariç) Sağlık Bakanlığınca onaylı endikasyonlarında
      kullanılması koşulu ile tüm hekimlerce raporsuz olarak en fazla bir kutu reçete edilmesi halinde, göğüs hastalıkları,
      immünoloji, immünoloji ve alerji, alerji veya çocuk sağlığı ve hastalıkları uzman hekimlerin biri tarafından düzenlenen
      uzman hekim raporu mevcut ise tedavinin devamı için diğer hekimlerce de reçete edilmesi halinde bedelleri Kurumca karşılanır;
      aynı grupta yer alan etkin maddeleri içeren iki ayrı nebül formundaki ilaçlar kombine olarak kullanılamaz (§4.2.24.B).
