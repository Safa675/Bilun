  condition:
    coverage_note: true
  action:
    enforcement: 'erişkin orta-ağır KOAH idame: ≥3 ay İKS+LABA veya LABA+LAMA yetersiz + sık atak (yılda ≥2 atak veya ≥1 yatarak)
      + dispne (mMRC≥2 veya CAT≥10); durum raporda belirtilmeli'
    message_tr: Mono LABA/LAMA/İKS veya sabit doz LABA/LAMA/İKS kombinasyonlarıyla yapılacak üçlü kombinasyon tedavilerinde;
      en az 3 ay süreyle İKS ve LABA veya LABA ve LAMA ile tedavi edildiği halde yeterli yanıt alınamayan, sık atak geçiren
      (yılda 2 ve üzeri atak veya 1 ve üzeri yatarak tedavi) ve dispnesi olan (mMRC 2 ve üzeri veya CAT skoru 10 ve üzeri)
      orta-ağır KOAH'lı erişkin hastaların idame tedavisinde kullanılmaları ve bu durumların uzman hekim raporunda belirtilmesi
      halinde bedelleri Kurumca karşılanır (§4.2.24.B).
