  action:
    enforcement: 'exemption: SABA veya SABA+SAMA inhale formları ile nebülizatörle uygulanan İKS, 4.2.24.B hükümlerinden istisnadır'
    message_tr: Kısa etkili solunum yolu beta-agonistini (SABA) veya kısa etkili solunum yolu beta-agonistini (SABA) ve obstrüktif
