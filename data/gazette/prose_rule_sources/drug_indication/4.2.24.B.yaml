      kronik obstrüktif akciğer hastalığı (KOAH) olan erişkin hastaların idame tedavisinde kullanılmaları ve bu durumların
      uzman hekim raporunda belirtilmesi halinde bedelleri Kurumca karşılanır (§4.2.24.B).
