rules:
- rule_id: 4.2.24.B.resp.copd_iks_laba_lama_failure_maintenance
  sut_section: 4.2.24.B
  gate_b_sources:
  - C006162
  drug_names:
  - flutikazon furoat+umeklidinyum+vilanterol
  - laba
  - lama
  - iks
  icd10_codes:
  - J44.0
  - J44.1
  - J44.9
  report_required: true
  report_specialties:
  - göğüs hastalıkları
  condition:
    coverage_note: true
  action:
    enforcement: 'erişkin orta-ağır KOAH idame: ≥3 ay İKS+LABA veya LABA+LAMA yetersiz + sık atak (yılda ≥2 atak veya ≥1 yatarak)
      + dispne (mMRC≥2 veya CAT≥10); durum uzman raporunda belirtilmeli'
    message_tr: En az 3 ay süreyle inhale kortikosteroid (İKS) ve uzun etkili solunum yolu beta-agonistleri (LABA) ile tedavi
      edildiği halde yeterli yanıt alınamayan, sık atak geçiren (yılda 2 ve üzeri atak veya 1 ve üzeri yatarak tedavi) ve
      dispnesi olan (mMrc 2 ve üzeri veya CAT skoru 10 ve üzeri) orta-ağır Kronik Obstrüktif Akciğer Hastalığı (KOAH) olan
      erişkin hastaların idame tedavisinde kullanılmaları ve bu durumların uzman hekim raporunda belirtilmesi halinde bedelleri
      Kurumca karşılanır (§4.2.24.B).
- rule_id: 4.2.24.B.resp.copd_triple_combo_maintenance
  sut_section: 4.2.24.B
  gate_b_sources:
