      damar cerrahisi uzman raporuyla tüm hekimlerce
    message_tr: Karaciğer enzimlerinden (AST/SGOT veya ALT/SGPT) en az birinin normalin üst sınırının ≥3 katı üstüne çıkması
      veya kreatin fosfokinaz düzeylerinin ≥2 kat üzerine çıkması nedeniyle statin kullanılamadığının belgelenmesi koşuluyla
