  report_required: true
  report_specialties:
  - kardiyoloji
  - iç hastalıkları
  - nöroloji
  - kalp damar cerrahisi
  condition:
    coverage_note: true
  action:
    enforcement: ≥6 ay statine rağmen LDL >100 mg/dL belgelenmişse; kardiyoloji/iç hastalıkları/nöroloji/kalp damar cerrahisi
      uzman raporuyla tüm hekimlerce
    message_tr: En az 6 ay boyunca statinlerle tedavi edilmiş olmasına rağmen LDL düzeyi 100 mg/dL'nin üzerinde kalan hastalarda
      bu durumun belgelenmesi koşuluyla kardiyoloji, iç hastalıkları, nöroloji ya da kalp damar cerrahisi uzmanlarından birinin
      raporuna istinaden tüm hekimlerce reçete edilebilir (§4.2.28.C).
