  action:
    enforcement: Leishmania donovani kaynaklı visseral leishmaniasis; amfoterisin B'ye yanıtsızlık/ciddi yan etki ile kontrendike
      olduğu veya HIV pozitif hastalarda amfoterisin B ile kombine olarak; 3. basamak resmi sağlık hizmet sunucusunda enfeksiyon
      ve klinik mikrobiyoloji veya çocuk enfeksiyon uzmanınca düzenlenen rapora istinaden bu uzmanlarca reçete edilirse ödenir
    message_tr: Leishmania donovani'nin neden olduğu visseral leishmaniasis tanısı almış hastaların tedavisinde; amphoterisin
      B tedavisine yanıtsızlık ya da ciddi yan etki nedeniyle amphoterisin B tedavisinin kontrendike olduğu durumlarda veya
      HIV pozitif hastalarda amphoterisin B ile kombine olarak üçüncü basamak resmi sağlık hizmet sunucularında, enfeksiyon
      hastalıkları ve klinik mikrobiyoloji veya çocuk enfeksiyon hastalıkları uzman hekimince düzenlenen sağlık raporuna istinaden
      enfeksiyon hastalıkları ve klinik mikrobiyoloji veya çocuk enfeksiyon hastalıkları uzman hekimi tarafından reçete edilmesi
      halinde bedeli Kurumca karşılanır (§4.2.54).
