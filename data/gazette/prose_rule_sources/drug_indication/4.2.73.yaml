      sağlık kurulu raporuyla göğüs hastalıkları uzmanlarınca reçete edilirse ödenir'
    message_tr: 'Rapor ve reçeteleme koşulları: Üçüncü basamak resmi sağlık hizmeti sunucularında düzenlenen en az bir göğüs
      hastalıkları uzman hekiminin yer aldığı 6 ay süreli sağlık kurulu raporuna istinaden göğüs hastalıkları uzman hekimlerince
      reçete edilmesi halinde bedeli Kurumca karşılanır (§4.2.73).'
