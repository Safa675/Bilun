section_id: 4.2.13.3.2.B
rules:
- rule_id: 4.2.13.3.2.B.hcv_geno1_4_rgtr_duration
  sut_section: 4.2.13.3.2.B
  gate_b_sources:
  - C004912
  drug_names:
  - interferon
  - peginterferon
  - ribavirin
  icd10_codes:
  - B17.1
  - B18.2
  report_required: true
  report_specialties:
  - gastroenteroloji
  - enfeksiyon hastalıkları
  action:
    enforcement: genotip 1/4 toplam 48 hafta; 12. hafta HCV RNA <2 log düşme → ≤16 hafta; 24. hafta pozitif → en geç 28. hafta
      kesilir; RNA sonuçları raporda
    message_tr: Genotip 1 ve 4 için tedavi 48 hafta; 12. haftada HCV RNA <2 log azalanlarda ≤16 hafta, 24. haftada pozitiflik
      devam edenlerde en geç 28. hafta kesilir; 16. haftada 2 log azalan ve 28. haftada RNA negatif olanlarda sonuç reçete/raporda
      belirtilir (§4.2.13.3.2.B).
- rule_id: 4.2.13.3.2.B.hcv_ifn_ribavirin_combination
  sut_section: 4.2.13.3.2.B
  gate_b_sources:
  - C004911
  drug_names:
  - interferon
  - peginterferon
  - ribavirin
  icd10_codes:
  - B17.1
  - B18.2
  report_required: true
  report_specialties:
  - gastroenteroloji
  - enfeksiyon hastalıkları
  action:
    enforcement: 'kronik HCV: IFN+RBV veya PegIFN+RBV; RBV kontrendike ise tek başına IFN/PegIFN; tek başına RBV endikasyonu
      yok'
    message_tr: Kronik hepatit C tedavisinde İnterferon+Ribavirin veya Peginterferon+Ribavirin kullanılır; Ribavirin kontrendikasyonu
      olanlarda tek başına İnterferon/Peginterferon kullanılabilir; tek başına Ribavirin endikasyonu yoktur (§4.2.13.3.2.B).
- rule_id: 4.2.13.3.2.B.paediatric_hcv_ribavirin_pegifn
