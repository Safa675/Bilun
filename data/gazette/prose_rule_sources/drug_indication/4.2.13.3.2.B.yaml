  - B18.2
  report_required: true
  report_specialties:
  - gastroenteroloji
  - enfeksiyon hastalıkları
  - çocuk sağlığı ve hastalıkları
  action:
    enforcement: '3-18 yaş: ribavirin 15 mg/kg/gün (maks 1200 mg/gün); peginterferon daha önce interferon almamış çocuklarda'
    message_tr: 3-18 yaş çocuklarda ribavirin 15 mg/kg/gün (maksimum 1.200 mg/gün); peginterferon daha önce interferon tedavisi
      almamış hastalarda uygulanabilir (§4.2.13.3.2.B).
