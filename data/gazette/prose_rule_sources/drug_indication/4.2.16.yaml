- rule_id: 4.2.16.adult_metabolic_3yr_report_all_prescribe
  sut_section: 4.2.16
  gate_b_sources:
  - C005908
  - C005910
  - C005947
  - C005984
  report_required: true
  report_duration_months: 36
  report_specialties:
  - endokrinoloji ve metabolizma hastalıkları
  - gastroenteroloji
  - iç hastalıkları
  condition:
    coverage_note: true
  action:
    enforcement: erişkin endokrinoloji/metabolizma veya gastroenteroloji uzmanınca (yoksa iç hastalıkları) düzenlenen 3 yıl
      süreli uzman raporuyla tüm hekimlerce reçete edilebilir
    message_tr: Erişkin endokrinoloji ve metabolizma hastalıkları ya da erişkin gastroenteroloji uzman hekimi tarafından,
      bu uzman hekimlerin bulunmadığı hastanelerde iç hastalıkları uzman hekimlerince düzenlenen 3 yıl süreli uzman hekim
      raporuna dayanılarak tüm hekimler tarafından reçete edilebilir (§4.2.16).
