- rule_id: 4.2.16.ckd_children_growth_sds_3bottles
  sut_section: 4.2.16
  gate_b_sources:
  - C006012
  icd10_codes:
  - N18
  - N18.2
  - N18.3
  - N18.4
  - N18.5
  report_required: true
  report_duration_months: 6
  report_specialties:
  - pediyatrik nefroloji
  prescriber_specialties:
  - pediyatrik nefroloji
  condition:
    coverage_note: true
  action:
    enforcement: KBY evre 2-5, ≥3 yaş, boy/kilo SDS ≤-1; 6 ay süreli pediyatrik nefroloji raporuyla günlük en fazla 3 şişe;
      boy SDS sıfıra yükselip 6 ay bu düzeyde seyrederse tedavi kesilir
    message_tr: Kronik böbrek hastalığı (evre 2-5) tanısı olan 3 yaş ve üzeri ve boy SDS ve/veya kilo SDS -1 ve altında olan
      çocuklarda; 6 ay süreli pediyatrik nefroloji uzman hekim raporuna istinaden pediyatrik nefroloji uzman hekimi tarafından
      günlük en fazla 3 şişe reçete edilmesi halinde bedeli Kurumca karşılanır. Boy SDS değeri sıfıra yükselip altı ay süre
      bu düzeyde seyretmesi halinde tedavi kesilir (§4.2.16).
