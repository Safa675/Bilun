section_id: 4.2.1.C-1
rules:
- rule_id: 4.2.1.C.ankylosing_spondylitis_nsaids_failure_report
  sut_section: 4.2.1.C-1
  gate_b_sources:
  - 4.2.1.C-1.(2)#d7d9f193
  drug_names:
  - anti-tnf
  - biyolojik ajan
  icd10_codes:
  - M45
  - M46.0
  - M46.1
  - M46.8
  - M46.9
  report_required: true
  report_duration_months: 3
  report_specialties:
  - romatoloji
  - fiziksel tıp ve rehabilitasyon
  action:
    enforcement: 'aksiyel SpA/AS: ≥3 NSAİİ maksimum dozda yetersiz (BASDAİ>5) + ESH>28 veya CRP↑ veya MR/sintigrafi aktif
      sakroilit; başlangıç 3 ay, devam 6 ay rapor'
    message_tr: 'Aksiyel tutulumlu ankilozan spondilit/non-radyografik aksiyel spondilartrit: en az 3 NSAİİ maksimum dozda
      yetersiz (BASDAİ>5), ESH>28 mm/s veya CRP↑ veya MR/sintigrafi ile aktif sakroilit varsa 3 ay süreli sağlık kurulu raporuyla
      başlanır; 3. ay değerlendirmesinde yetersiz cevap (BASDAİ''de <2 düzelme) devamında bedeli ödenmez, cevap alınırsa 6
      ay süreli rapor gerekir (§4.2.1.C-1).'
- rule_id: 4.2.1.C.anti_tnf_dmard_combination
  sut_section: 4.2.1.C-1
  gate_b_sources:
  - 4.2.1.C-1.(8)
  drug_names:
  - anti-tnf
  - metotreksat
  - sulfasalazin
  - leflunomid
  condition:
    coverage_note: true
  action:
    enforcement: 'permission: anti-TNF ilaçlar diğer antiromatizmal ilaçlarla kombine kullanılabilir'
    message_tr: Anti-TNF ilaçlar diğer antiromatizmal ilaçlar ile kombine olarak da kullanılabilir (§4.2.1.C-1).
- rule_id: 4.2.1.C.biologic_administration_setting
  sut_section: 4.2.1.C-1
  gate_b_sources:
  - 4.2.1.C-1.(7)
  drug_names:
  - anti-tnf
  - biyolojik ajan
  report_required: true
  report_specialties:
  - fiziksel tıp ve rehabilitasyon
  - iç hastalıkları
  - çocuk sağlığı ve hastalıkları
  action:
    enforcement: IV formlar ilgili uzman bulunan kurumda; SC ilk dozlar uzman gözetiminde; eğitim + 'Mahallinde tedavisi sürdürülebilir'
      ibaresi ile 12 haftalık dozlar halinde reçete
    message_tr: İntravenöz formlar fiziksel tıp/iç hastalıkları/çocuk sağlığı uzmanının bulunduğu kurumda uygulanır; subkütan
      ilk dozlar uzman gözetiminde yapılır, enjeksiyon eğitimi ve 'Mahallinde tedavisi sürdürülebilir' rapor ibaresiyle 12
      haftalık dozlar halinde reçete edilebilir (§4.2.1.C-1).
- rule_id: 4.2.1.C.juvenile_ra_das28_activity_scoring
  sut_section: 4.2.1.C-1
  gate_b_sources:
  - 4.2.1.C-1.(3)#7e4806b5
  drug_names:
  - anti-tnf
  - biyolojik ajan
  icd10_codes:
  - M08.0
  report_required: true
  report_specialties:
  - romatoloji
  - fiziksel tıp ve rehabilitasyon
  action:
    enforcement: ≥18 yaş juvenil romatoid artrit (poliartiküler) — DAS28 skorlaması esastır; <18 yaş ACR pediatrik yanıt alınanlarda
      DAS28 aranmaz, alevlenmede erişkin koşulları geçerli
    message_tr: 18 yaş ve üzerinde juvenil romatoid artritli hastalarda DAS28 skoruna göre hastalık aktivite ölçümü esastır;
      <18 yaş ACR pediatrik yanıt alınan mevcut tedaviye devam edilebilir, alevlenmede erişkin (DAS28) koşulları geçerlidir
      (§4.2.1.C-1).
