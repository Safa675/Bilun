section_id: 4.2.14.C
source_note: Exported from drug_combination_4_2.json (YAML source migration)
rules:
- rule_id: 4.2.14.C.(breast).ribociclib_palbociclib_after_ai_progression
  sut_section: 4.2.14.C
  condition:
    diagnosis_any:
    - C509
    drug_name_any:
    - ribosiklib
    - palbosiklib
    prior_ai_therapy_months:
      min: 6
    disease_progression: true
  action:
    billable: true
    payment_tr: nüks/metastatik meme kanseri; 1. sıra AI ≥6 ay sonrası progresyonda ribosiklib/palbosiklib + AI kombinasyonu
      ödenir
  gate_b_sources:
  - C005005
- rule_id: 4.2.14.C.(renal).temsirolimus_poor_prognosis_3of6
  sut_section: 4.2.14.C
  condition:
    diagnosis_any:
    - C64
    - C65
    - C66
    drug_name_any:
    - temsirolimus
    poor_prognosis_criteria_met_count:
      min: 3
      of: 6
    two_oncology_specialist_report: false
  action:
    billable: false
    denial_tr: temsirolimus; metastatik RCC'de 6 kötü prognoz kriterinden ≥3 olan hastalarda 2 onkoloji uzmanı raporuyla ödenir
    severity: error
  gate_b_sources:
  - 4.2.14.C.k
- rule_id: 4.2.14.C.(renal).rcc_tki_sequential_combo_no_pay
  sut_section: 4.2.14.C
  condition:
    diagnosis_any:
    - C64
    - C65
    - C66
    drug_name_set_any_two:
    - temsirolimus
    - sunitinib
    - sorafenib
    - pazopanib
    sequential_or_combination: true
  action:
    billable: false
    denial_tr: metastatik RCC'de temsirolimus/sunitinib/sorafenib/pazopanib ardışık veya kombine kullanılamaz; sadece biri
      ödenir
    severity: error
  gate_b_sources:
  - C005108
  - 4.2.14.C.(4)#f03d7d17
- rule_id: 4.2.14.C.(melanoma).braf_sequential_no_pay
