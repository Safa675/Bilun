- rule_id: 4.2.14.C.(pembro_nsclc_pdl1_lt_50).tier_c_review
  sut_section: 4.2.14.C
  condition:
    diagnosis_any:
    - C341
    - C349
    drug_name_any:
    - pembrolizumab
    pdl1_expression_pct:
      max: 49
    ecog_score:
      max: 1
    egfr_alk_ros_mutation: false
  action:
    billable: null
    denial_tr: 'Tier C (klinik doğrulama gerekli): pembrolizumab PD-L1 <%50 NSCLC''de ECOG 0-1 + mutasyon negatif + beyin
      metastazı yok koşuluyla; PD-L1/ECOG doğrulanmalı'
    severity: review
    tier: C
    clinical_fields_needed:
    - pdl1_expression_pct
    - ecog_score
    - brain_metastasis_status
  gate_b_sources:
  - 4.2.14.C.(1)#c2e95516
