ase; patient 14 is S17 (a month of haemodialysis) and, as its second bill (encounter_no 2), S23 (an emergency session); patient 15 is S18 (decompensated cirrhosis with albumin) and, as its second bill (encounter_no 2), S24 (a variceal rebleed with two red-cell units) (the story ids are not contiguous). A recipe without a fault is a clean bill; `medula_events` lists the MEDULA rejections of the bill.
