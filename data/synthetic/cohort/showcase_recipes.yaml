# billing fault: patients 1..8 are the stories S1..S8, patient 2 has three more bills, a control visit S32 (encounter_no 2, a clean bill), a readmission through the ER S33 and the control after it S34 (encounter_no 3 and 4), patient 7 has an observation under 24 hours S47 and a follow-up S48 (encounter_no 2 and 3; S48 is a clean bill), patient 9 is S9, patient 4 has two more bills, a control visit S39 (a clean bill) and a second visit S40 (encounter_no 2 and 3); patient 10 is S11 and, as its second bill (encounter_no 2), S14; patient 11 is S12; patient 12 is S10 (the ER visit, with a MEDULA rejection event) and, as its second bill (encounter_no 2), S22; patient 13 is S20, the first day case (the story ids are not contiguous). A recipe without a fault is a clean bill; `medula_events` lists the MEDULA rejections of the bill.
# Encounter pins come from each pathway's own showcase block; no prices or amounts are stored here.
