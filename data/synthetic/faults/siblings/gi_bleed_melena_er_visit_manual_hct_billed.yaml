# Melena in the ER, a blood count AND the manual haematocrit billed beside it — faulty sibling of S10.
# Showcase story S10 faulty bill (reports/synthetic-data/2026-10-15-showcase-proofs/stories.py, s10("faulty")).
# The hemogram L107020 is the whole blood count and its result set carries the haematocrit; the manual haematocrit L103120 is the only
# separately coded CBC test, so billing it beside the hemogram is a CBC component billed twice (the engine's hemogram unbundling, #270).
