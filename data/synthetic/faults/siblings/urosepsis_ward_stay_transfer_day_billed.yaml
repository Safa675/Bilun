# Urosepsis, ward stay after the transfer out of intensive care, bed billed from the transfer day — faulty sibling of S14.
# Showcase story S14 faulty bill (reports/synthetic-data/2026-10-15-showcase-proofs/stories.py, s14("faulty")).
# The ward bill bills the bed (510010) on the day the patient leaves intensive care too, the day the ICU bill's 510090 already pays.
schema_version: 1
id: urosepsis_ward_stay_transfer_day_billed
title: "Urosepsis, ward stay after the transfer out of intensive care, bed billed from the transfer day"
claim_type: yatis
billing_mode: itemized
department:
  name: "İç Hastalıkları"
  specialty: "1000"                  # EK-2A: İç Hastalıkları

patient:
  sex:
    values: [M, F]
    basis: judgment
    source: "Urosepsis occurs in both sexes; A41.9 and N39.0 have no sex gate. Story S14 is the woman of story S11 (the same patient, the next bill)."
  age:
    min: 60
    max: 90
    basis: judgment
    source: "Story S14 patient was born in 1950 (76 years), like story S11. Urosepsis with shock is a disease of the elderly; the bounds are the author's judgment."

nights:
  min: 2
  max: 8
  basis: judgment
  source: "Story S14 has 3 nights. After septic shock a ward stay of a few days follows; 2 and 8 are the author's judgment. Internist to confirm."

complaint:
  text: "Yoğun bakımdan servise alındı; ateşi düştü, halsizlik ve iştahsızlık sürüyor."
  basis: judgment
  source: "Story S14: what the patient (or a relative) says on arrival; the author's reading of the story. Clinician to confirm."

diagnoses:
  - icd10: A41.9
    name: "SEPTİSEMİ, TANIMLANMAMIŞ"
    role: primary
    day: admit
    basis: guideline
    source: "SKRS leaf code; WHO ICD-10: A41.9 is sepsis, organism not specified. Story S14 continues the treatment of the urosepsis of story S11 on the ward."
  - icd10: N39.0
    name: "ÜRİNER SİSTEM ENFEKSİYONU, YERİ TANIMLANMAMIŞ"
    role: secondary
    day: admit
    basis: guideline
    source: "SKRS leaf code; WHO ICD-10: N39.0 urinary tract infection, site not specified: the source of the urosepsis. R57.8 (S11) is dropped: the shock has resolved."

procedures:
  # --- the stay as a plain ward stay: a bed for every calendar day, the transfer day included (the fault)
  - id: bed
    kind: bed
    code: "510010"
    name: "Standart yatak tarifesi"
    days: admit..discharge             # 4 lines for 3 nights: the first is the transfer day the ICU bill already paid
    basis: sut
    source: "C001243 (SUT 2.4.4.H.(8)), EK-2B 510090 (yemek, yatak, vizit): the ICU bill pays the day the patient leaves; 510010 on it too is double billing."
  - id: companion
    kind: companion
    code: "510121"
    name: "Refakat"
    days: admit..discharge-1           # 3 lines for 3 nights
    pending: "#297 Q2"                 # whether hospitals count the discharge day in refakatciGunSayisi
    basis: sut
    source: "C001628 (SUT 2.6.3(2)): the companion is billed with 510121; a ward doctor's statement of need is on file (age, post-shock weakness). Clinician to confirm."

showcase:
  story: S14
  sex: F
  age: 76
  admit: "2026-06-07"
  nights: 3
