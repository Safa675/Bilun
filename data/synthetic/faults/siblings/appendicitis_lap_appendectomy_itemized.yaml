# Acute appendicitis, laparoscopic appendectomy, ward stay billed itemized (hizmet başı) — faulty sibling of S1.
# Showcase story S1 faulty bill (reports/synthetic-data/2026-10-15-showcase-proofs/stories.py, s1("faulty")).
# Instead of the mandatory EK-2C package P610131 (C000646), the stay is billed itemized on EK-2B.
schema_version: 1
id: appendicitis_lap_appendectomy_itemized
title: "Acute appendicitis, laparoscopic appendectomy, ward stay billed itemized"
claim_type: yatis
billing_mode: itemized
department:
  name: "Genel Cerrahi"
  specialty: "1900"                  # EK-2A: Genel Cerrahi
window:                              # narrowed; the source says why
  start: "2026-04-16"
  end: "2026-09-30"
  source: "The puan of 610131 (5096.64) enters band C (3005-6000) when the surgical group bands switch on 2026-04-16; before that it was band B (5001-7583)."

patient:
  sex:
    values: [M, F]
    basis: judgment
    source: "Appendicitis occurs in both sexes and K35.9 has no sex gate; story S1 is a man. Clinician to confirm."
  age:
    min: 18
    max: 70
    basis: judgment
    source: "Story S1 patient is 34. Adults only: children go to paediatric surgery. The upper bound is the author's judgment."

nights:
  min: 1
  max: 4
  basis: judgment
  source: "Story S1 has 2 nights. Min 1 keeps op+1 labs and pathology inside the stay; max 4 matches the package pathway."

op_day: admit                        # admitted in the evening, operated the same night

diagnoses:
  - icd10: K35.9
    name: "AKUT APANDİSİT, TANIMLANMAMIŞ"
    role: primary
    day: admit
    basis: guideline
    source: "SKRS leaf code (review 2026-10-16 Q12; SKRS has no K35.8); WHO ICD-10 Vol. 2. Story S1: no chronic disease."

procedures:
  # --- the operation and its anaesthesia
  - id: appendectomy
    kind: operation
    code: "610131"
    name: "Appendektomi, laparoskopik"
    days: op
    basis: sut
    source: "C000652 (SUT 2.2.2.A(1)): EK-2B code 610131 keyed instead of the mandatory EK-2C package P610131 (C000646, story S1 faulty bill)."
  - id: anaesthesia
    kind: anaesthesia
    code: "550170"
    name: "Anestezi C grubu"
    days: op
    specialty: "3100"                # EK-2A: Anesteziyoloji ve Reanimasyon (overrides the department's branch)
    group: C
    operations: [appendectomy]
    basis: sut
    source: "EK-2B section 4: the puan of 610131 (5096.64) is in band 'C grubu' (3005-6000 from 2026-04-16); billed apart in hizmet başı, C000652."

  # --- the stay: one bed line per calendar day
  - id: bed
    kind: bed
    code: "510010"
    name: "Standart yatak tarifesi"
    days: admit..discharge             # 3 lines for 2 nights: the discharge day is billed too
    basis: medula_kilavuz
    source: "Kılavuz p.62, p.168 (stay range, discharge date); El Kitabı: bed on the discharge day. Review Q1: güçlü çıkarım. Under 24 h: 510120 (C000648)."

  # --- laboratory and pathology on the first post-operative day
  - id: post_op_labs
    kind: lab
    items:
      - {code: "L107020", name: "Tam Kan Sayımı (Hemogram)"}
      - {code: "L101850", name: "C reaktif protein (CRP)"}
    days: op+1
    basis: judgment
    source: "Story S1 faulty bill: admission CBC and CRP were drawn in the ER on its own acil takip; the ward repeats them on the first post-op day."
  - id: pathology
    kind: lab
    code: "910230"
    name: "Apendiks, insidental dışında"
    days: op+1
    basis: judgment
    source: "Story S1 faulty bill: routine histopathological examination of the resected appendix, entered on the first post-op day."

drugs:
  - id: ceftriaxone
    barcode: "8699508270224"
    name: "IESEF 1 G IV ENJEKSIYONLUK COZELTI TOZU"
    inn: "seftriakson"
    unit: vial
    per_box: 1
    day: op
    qty: 1                             # one pre-operative dose, none after
    basis: guideline
    source: "WSES 2020 Jerusalem guidelines, as story S1 cites: one pre-operative antibiotic dose and none after for uncomplicated appendicitis."
  - id: metronidazole
    barcode: "8697637691743"
    name: "NEOFLEKS %0,5 METRONIDAZOL I.V. ENJ COZ 100 ML (SETLI)"
    inn: "metronidazol"
    unit: bottle
    per_box: 1
    day: op
    qty: 1                             # one pre-operative dose alongside ceftriaxone
    basis: guideline
    source: "WSES 2020 Jerusalem guidelines, as story S1 cites: anaerobic cover alongside ceftriaxone as one pre-operative dose."
  - id: paracetamol
    barcode: "8699844770716"
    name: "PARTEMOL 1 G/100 ML INF ICIN COZ ICEREN 1 FLK"
    inn: "parasetamol"
    unit: vial
    per_box: 1
    day: op
    qty: 5                             # 5 vials of 1 g across the stay
    basis: judgment
    source: "Story S1 faulty bill: 5 vials of 1 g IV paracetamol for peri- and post-operative analgesia across the stay; no guideline named."

notes:
  - "Faulty sibling of appendicitis_lap_appendectomy_package (story S1): the coder keyed the EK-2B code 610131 and billed the stay itemized instead of the mandatory EK-2C package P610131 (C000646)."
  - "The patient reaches the ward from the ER. That ER visit (exam, CBC/CRP, ultrasound) is billed on its own acil takip and is not part of this bill (story S1)."

showcase:
  story: S1
  sex: M
  age: 34
  admit: "2026-07-14"
  nights: 2
