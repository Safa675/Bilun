# Control visit three weeks after the discharge of story S2 (COPD exacerbation with pneumonia), outpatient, billed itemized; a clean bill.
# Showcase story S32 (plans/data/2026-10-20-demo-coverage-first-plan.md, card F2 b2): bill 2 of the patient of S2. The patient's chronic
# health report is on file, so the EK-1/A exemption waives his share of the examination; the bill is billed as usual.
# Grammar: README.md next to this file. A visit has no nights and no stay: `admit` is the visit day and the only day.
schema_version: 1
id: copd_exacerbation_post_discharge_control
title: "Control visit after a COPD exacerbation with pneumonia, outpatient, billed itemized"
claim_type: poliklinik
billing_mode: itemized
department:
  name: "Göğüs Hastalıkları"
  specialty: "1171"                  # EK-2A: Göğüs Hastalıkları
# No window: the default service window of code_sets.yaml (2026-02-01 .. 2026-09-30) applies.

patient:
  sex:
    values: [M, F]
    basis: judgment
    source: "Story S32 is the man of story S2 (the same patient, the next bill); J44.0 and I10 have no sex gate. Clinician to confirm."
  age:
    min: 55
    max: 90
    basis: judgment
    source: "Story S32 patient is 81, like story S2; the bounds are those of story S2 (the author's judgment)."

diagnoses:
  - icd10: J44.0
    name: "KRONİK OBSTRÜKTİF AKCİĞER HASTALIĞI, AKUT ALT SOLUNUM YOLU ENFEKSİYON İLE"
    role: primary
    day: admit
    basis: judgment
    source: "SKRS leaf code; the control follows the exacerbation of story S2, so J44.0 stays the principal code. Clinician to confirm."
  - icd10: I10
    name: "ESANSİYEL (PRİMER) HİPERTANSİYON"
    role: secondary
    day: admit
    basis: judgment
    source: "Story S2 lists I10 as a comorbidity of this patient; it is coded on every bill of his."

procedures:
  - id: exam
    kind: exam
    code: "520030"
    name: "Normal poliklinik muayenesi"
    days: admit
    copay:                             # the patient's share of the visit: SGK pays 80 %
      rate: 0.20
      basis: judgment
      source: "C000296 (SUT 1.8.1.(1)): the visit copay. SUT sets a fixed amount (C000304); the demo models it as a 20 % share. Billing officer to confirm."
    basis: sut
    source: "C000572 (SUT 2.2.1.B-1.(1)): an outpatient application is paid per application; the demo bills the visit as one EK-2B 520030 line."

notes:
  - "The visit is 22 days after the discharge of story S2 (2026-03-15). Story S2 is billed itemized, so no package period (C000714) applies to the visit."
  - "The chronic health report is a fact of the patient (showcase `chronic_health_report`, on every bill of his): with it the EK-1/A exemption (C000372, SUT 1.8.5.(7)) waives his share of a specialist examination for the listed disease."
  - "No test is billed: the visit is the clinical control of the exacerbation. J44.0 and I10 are diagnoses of story S2, so the list of the patient's diagnoses stays the one of the stay."

showcase:
  story: S32
  sex: M
  age: 81
  admit: "2026-04-06"
  chronic_health_report: true
