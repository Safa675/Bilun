notes:
  - "The visit is on Tuesday 2026-09-22, three days after the discharge of story S42 (2026-09-19). After a resection arthroplasty the patient walks with a walker."
  - "An orthopaedic control would bill its examination inside the package periods of stories S5 and S42: an outpatient examination of the same branch within 10 days of a package discharge, the end of the group's window counting as the discharge (C000713, C000714). So the demo sends the walker visit to physiatry, another branch; story F1 b3 is the bill that shows that rule (dormant, #337)."
  - "The walker is the patient's first on the bills of the demo, so its MIAT of 1 year (C002781, SUT 3.1.2.(9)) starts on this day. Story S5 says she walked with a walker before the fracture: the demo assumes that one was not billed to SGK within the last year (billing officer to confirm)."
  - "The specialist report the walker needs (report type H: uzman hekim raporu) is the physiatrist's, written at this visit; the claim model has no report field for a material."
  - "No test is billed. S72.00 is a diagnosis of story S5, so the patient's list of diagnoses does not grow with this bill."

