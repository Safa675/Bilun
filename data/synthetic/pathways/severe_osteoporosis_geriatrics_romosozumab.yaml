notes:
  - "The visit is on Thursday 2026-09-24, five days after the discharge of story S42; geriatrics is another branch than orthopaedics, so no package period of stories S5 or S42 applies (C000714)."
  - "The health-board report (endocrinology, physical medicine or geriatrics, C006166) states a T-score of -3.5 or lower and two fractures proven on X-ray: the hip fracture of story S5 and a vertebral compression fracture the films show. Neither number is a field of the claim model."
  - "Continuation after 24 weeks needs a new report of 6 months (C006167) and the whole treatment is at most 12 months; the first report is never 12 months, which is the fault of this bill."
  - "Open for a geriatrician: whether romosozumab is started three weeks after a hip fracture operation and during the treatment of a prosthesis infection, and its cardiovascular contraindications. Open for the billing officer: whether a romosozumab prescription appears on the hospital's outpatient bill or only on the pharmacy's."
  - "M81.09 and I10 are diagnoses of story S5, so the patient's list of diagnoses does not grow with this bill. Drug prices enter at 0 TL (no public list price in the repo)."

